name: Generate lessons
on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * *"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python generate.py
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      - if: always()
        run: |
          git config user.name "course-bot"
          git config user.email "bot@users.noreply.github.com"
          git add courses
          git diff --staged --quiet || (git commit -m "Add generated lessons" && git push)
