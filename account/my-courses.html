<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>My Courses | Learning Hub</title><style>
*{box-sizing:border-box}
body{margin:0;font-family:Inter,system-ui,Arial,sans-serif;color:#0d1b2a;background:#fbfaf6;min-height:100vh}
/* header, same on every page */
.top{display:flex;align-items:center;gap:12px;padding:12px 16px;background:#0b4d2a;border-bottom:3px solid #f2c230;color:#fff;min-height:74px}
.menu{width:46px;height:46px;border-radius:14px;background:#ffffff1f;border:0;display:flex;align-items:center;justify-content:center;flex:0 0 46px}
.logo{width:50px;height:50px;border-radius:50%;background:#fff;object-fit:contain;flex:0 0 50px}
.brand{flex:1;min-width:0}
.brand b{display:block;font:700 26px/1.05 Georgia,'Times New Roman',serif;white-space:nowrap}
.brand small{display:block;color:#f2c230;letter-spacing:.2em;font-weight:600;font-size:13px;margin-top:3px;white-space:nowrap}
.bell{position:relative;width:44px;height:44px;display:flex;align-items:center;justify-content:center;flex:0 0 44px}
.badge{position:absolute;top:0;right:-2px;background:#e53935;color:#fff;border-radius:50%;width:22px;height:22px;font:700 12px/22px Inter;text-align:center}
.who{display:flex;align-items:center;gap:6px;flex:0 0 auto}
.avatar{width:48px;height:48px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center}
/* banner */
.banner{display:flex;align-items:center;gap:22px;margin:14px 16px 16px;padding:18px 20px;border-radius:22px;background:linear-gradient(100deg,#dcecd6,#f1f7ec);min-height:108px}
.ic{width:90px;height:90px;border-radius:50%;background:#cfe5cb;display:flex;align-items:center;justify-content:center;flex:0 0 90px}
.banner h1{margin:0;font:700 40px/1.05 Georgia,'Times New Roman',serif;color:#0b4d2a}
.banner p{margin:4px 0 0;color:#2a3d31;font-size:17px}
/* tabs */
.tabs{display:flex;gap:12px;padding:0 16px;margin:0 0 16px;flex-wrap:wrap}
.tab{flex:1 1 0;min-width:0;text-align:center;border:1.5px solid #d6dbd8;border-radius:30px;padding:14px 8px;font:600 17px Inter;background:#fff;color:#0d1b2a;white-space:nowrap}
.tab.on{background:#0b4d2a;border-color:#0b4d2a;color:#fff}
/* cards */
#grid{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding:0 16px 40px}
@media(min-width:900px){#grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.card{min-width:0;position:relative;display:flex;gap:18px;background:#fff;border:1.5px solid #e5e2d6;border-radius:20px;padding:16px}
.cover{width:132px;height:132px;flex:0 0 132px;border-radius:18px;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;overflow:hidden;padding:8px}
.cover .code{font:800 26px/1 Inter;letter-spacing:.02em;word-break:break-word}
.cover .sub{font:600 12px Inter;letter-spacing:.14em;margin-top:6px;opacity:.9}
.info{flex:1;min-width:0;display:flex;flex-direction:column;gap:8px}
.title{margin:0;font:700 23px/1.2 Inter;color:#0d1b2a;padding-right:36px}
.meta{font:500 16px Inter;color:#333d46;display:flex;align-items:center;gap:8px}
.prog{display:flex;align-items:center;gap:12px}
.bar{flex:1;height:8px;border-radius:6px;background:#e7e7e7;overflow:hidden}
.bar i{display:block;height:100%;background:#f2c230;border-radius:6px}
.pct{font:700 17px Inter;color:#0d1b2a;min-width:48px;text-align:right}
.acts{display:flex;gap:12px;margin-top:4px;flex-wrap:wrap}
.btn{min-width:0;display:flex;align-items:center;justify-content:center;gap:8px;height:46px;border-radius:26px;font:700 16px Inter;text-decoration:none;cursor:pointer;flex:1 1 0;min-width:0;white-space:nowrap}
.btn.dark{background:#0b4d2a;color:#fff;border:0}
.btn.out{background:#fff;color:#0b4d2a;border:1.5px solid #0b4d2a}
.corner{position:absolute;top:14px;right:14px;background:none;border:0;padding:4px}
#empty{display:none;margin:8px 16px 40px;padding:18px;border-radius:16px;background:#fff;border:1.5px solid #e5e2d6;color:#5f6b63;font-size:16px}
[hidden]{display:none!important}
@media(max-width:440px){
  .top{gap:8px;padding:10px}.menu{width:40px;height:40px;flex-basis:40px}.logo{width:42px;height:42px;flex-basis:42px}
  .brand b{font-size:21px}.brand small{font-size:11px;letter-spacing:.14em}.avatar{width:40px;height:40px}
  .banner h1{font-size:32px}.ic{width:70px;height:70px;flex-basis:70px}.banner{gap:14px}
  .cover{width:104px;height:104px;flex-basis:104px}.cover .code{font-size:20px}
  .title{font-size:19px}.btn{font-size:14px;height:42px;padding:0 8px;gap:5px}.tab{font-size:14px;padding:12px 4px}.tabs{gap:8px}
}

</style></head><body data-list="courses" data-heart="0"><header class="top"><button class="menu" aria-label="Menu"><svg width="26" height="26" viewBox="0 0 24 24" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button><img class="logo" src="../site/logo.png" alt=""><div class="brand"><b>Learning Hub</b><small>FUE KONTAGORA</small></div></header><section class="banner"><div class="ic"><svg width="54" height="54" viewBox="0 0 24 24" fill="#0b4d2a"><path d="M12 3L1.5 8.5 12 14l8.5-4.4V16h1.5V8.5zM6 11.3V16c0 1.9 2.7 3.5 6 3.5s6-1.6 6-3.5v-4.7L12 15.5z"/></svg></div><div><h1>My Courses</h1><p>Access and continue your enrolled courses</p></div></section><div class="tabs"><button class="tab on" data-tab="all">All Courses (<span id="nAll">0</span>)</button><button class="tab" data-tab="progress">In Progress (<span id="nProg">0</span>)</button><button class="tab" data-tab="done">Completed (<span id="nDone">0</span>)</button></div><main id="grid"></main><div id="empty">Nothing here yet. Press and hold a course on your phone (or right-click on a computer) and choose Add to Library or Add to Favourite.</div><script>
window.HUB_CONFIG = {

  supabaseAnonKey: 'PASTE_YOUR_SUPABASE_ANON_KEY'
};
</script>
<script>
/* Shared account code: sign-in, the course lists (Library, Favourite, My Courses),
   and the press-and-hold (phone) and right-click (computer) menu on course cards. */
(function () {
  var CFG = window.HUB_CONFIG || {};
  var ROOT = /\/(account|admin)\//.test(location.pathname) ? '../' : '';
  var READY = !!(CFG.supabaseUrl && CFG.supabaseAnonKey && CFG.supabaseUrl.indexOf('PASTE') < 0);
  var client = null;

  function loadLibrary() {
    return new Promise(function (resolve, reject) {
      if (window.supabase) return resolve(window.supabase);
      var s = document.createElement('script');
      s.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2';
      s.onload = function () { resolve(window.supabase); };
      s.onerror = function () { reject(new Error('Could not load the sign-in library.')); };
      document.head.appendChild(s);
    });
  }
  var ready = READY
    ? loadLibrary().then(function (sb) { client = sb.createClient(CFG.supabaseUrl, CFG.supabaseAnonKey); return client; })
    : Promise.resolve(null);

  function user() {
    return ready.then(function (c) {
      if (!c) return null;
      return c.auth.getUser().then(function (r) { return r.data.user; });
    });
  }

  var HUB = (window.HUB = {
    root: ROOT,
    ready: READY,
    user: user,
    client: function () { return client; },
    ensureReady: function () { return ready; },
    requireLogin: function () {
      return user().then(function (u) {
        if (!u) location.href = ROOT + 'account/login.html?next=' + encodeURIComponent(location.pathname + location.search);
        return u;
      });
    },
    profile: function () {
      return user().then(function (u) {
        if (!u) return null;
        return client.from('profiles').select('*').eq('id', u.id).single().then(function (r) { return r.data; });
      });
    },
    addCourse: function (courseId, list) {
      return HUB.requireLogin().then(function (u) {
        if (!u) return null;
        return client.from('user_courses').upsert({ user_id: u.id, course_id: courseId, list: list },
          { onConflict: 'user_id,course_id,list' });
      });
    },
    removeCourse: function (courseId, list) {
      return user().then(function (u) {
        if (!u) return null;
        return client.from('user_courses').delete().eq('user_id', u.id).eq('course_id', courseId).eq('list', list);
      });
    },
    listCourses: function (list) {
      return user().then(function (u) {
        if (!u) return [];
        return client.from('user_courses').select('course_id').eq('user_id', u.id).eq('list', list)
          .order('created_at', { ascending: false })
          .then(function (r) { return (r.data || []).map(function (x) { return x.course_id; }); });
      });
    },
    catalogue: function () {
      var out = [];
      return fetch(ROOT + 'courses/index.json?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.json() : []; })
        .catch(function () { return []; })
        .then(function (idx) {
          idx.forEach(function (c) { out.push(c); });
          return fetch(ROOT + 'manual-upload.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; })
            .catch(function () { return ''; })
            .then(function (txt) {
              txt.split('\n').forEach(function (raw) {
                var line = raw.trim(); if (!line || line.charAt(0) === '#') return;
                var flags = (line.match(/\[([^\]]+)\]/g) || []).map(function (m) { return m.slice(1, -1).trim().toLowerCase(); });
                var title = line.replace(/\[[^\]]+\]/g, '').trim();
                var kind = flags.indexOf('pdf') >= 0 ? 'pdf' : flags.indexOf('html') >= 0 ? 'html' : null;
                if (!kind || !title) return;
                var id = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
                var depts = flags.filter(function (f) { return f.indexOf('dept=') === 0; })
                  .reduce(function (a, f) { return a.concat(f.slice(5).split('+')); }, []).filter(Boolean);
                var code = ((flags.filter(function (f) { return f.indexOf('code=') === 0; })[0] || '').slice(5)).toUpperCase();
                if (!out.some(function (c) { return c.id === id; }))
                  out.push({ id: id, title: title, kind: kind, depts: depts, code: code, school: flags.indexOf('school') >= 0,
                             total: 1, ready: 1, manual: true, url: '../manual/' + kind + '/' + id + (kind === 'pdf' ? '.pdf' : '.html') });
              });
              return out;
            });
        });
    },
    openLink: function (c) {
      if (c.kind === 'pdf') return ROOT + (c.url || 'courses/pdf/' + c.id + '.pdf');
      return ROOT + 'reader.html#/c/' + c.id;
    },
    toast: function (msg) {
      var t = document.getElementById('hub-toast');
      if (!t) { t = document.createElement('div'); t.id = 'hub-toast'; document.body.appendChild(t); }
      t.textContent = msg; t.className = 'show';
      clearTimeout(t._h); t._h = setTimeout(function () { t.className = ''; }, 2200);
    }
  });

  /* ---- press and hold (phone) and right click (computer) on course cards ---- */
  var css = document.createElement('style');
  css.textContent =
    '#hub-menu{position:fixed;z-index:999;display:none;min-width:220px;background:#fff;border:1px solid #d8d2bf;border-radius:14px;' +
    'box-shadow:0 12px 30px rgba(0,0,0,.18);padding:6px;font:600 15px Inter,system-ui,sans-serif}' +
    '#hub-menu button{display:flex;width:100%;align-items:center;gap:10px;background:none;border:0;padding:12px 12px;border-radius:10px;' +
    'color:#14221c;text-align:left;cursor:pointer;font:inherit}#hub-menu button:hover{background:#f1efe6}' +
    '#hub-toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#14221c;color:#fff;' +
    'padding:12px 18px;border-radius:12px;opacity:0;transition:.25s;z-index:1000;font:600 14px Inter,sans-serif;pointer-events:none}' +
    '#hub-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}';
  document.head.appendChild(css);

  var menu = document.createElement('div');
  menu.id = 'hub-menu';
  menu.innerHTML = '<button type="button" data-l="library">&#128278;&nbsp; Add to Library</button>' +
                   '<button type="button" data-l="favourite">&#10084;&nbsp; Add to Favourite</button>';
  document.body.appendChild(menu);
  var current = null, suppressClick = false;

  function showMenu(x, y, id) {
    current = id;
    menu.style.left = Math.min(x, window.innerWidth - 240) + 'px';
    menu.style.top = Math.min(y, window.innerHeight - 120) + 'px';
    menu.style.display = 'block';
  }
  function hideMenu() { menu.style.display = 'none'; current = null; }

  function courseIdFrom(el) {
    var n = el && el.closest && el.closest('[data-c]');
    return n ? n.getAttribute('data-c') : null;
  }
  document.addEventListener('contextmenu', function (e) {
    var id = courseIdFrom(e.target);
    if (!id) return;
    e.preventDefault();
    showMenu(e.clientX, e.clientY, id);
  });
  var pressTimer = null, startX = 0, startY = 0;
  document.addEventListener('touchstart', function (e) {
    var id = courseIdFrom(e.target);
    if (!id) return;
    startX = e.touches[0].clientX; startY = e.touches[0].clientY;
    pressTimer = setTimeout(function () {
      suppressClick = true;
      showMenu(startX, startY, id);
      if (navigator.vibrate) navigator.vibrate(20);
    }, 500);
  }, { passive: true });
  ['touchend', 'touchcancel'].forEach(function (ev) {
    document.addEventListener(ev, function () { clearTimeout(pressTimer); }, { passive: true });
  });
  document.addEventListener('touchmove', function (e) {
    var t = e.touches[0];
    if (Math.abs(t.clientX - startX) > 10 || Math.abs(t.clientY - startY) > 10) clearTimeout(pressTimer);
  }, { passive: true });
  document.addEventListener('click', function (e) {
    if (suppressClick) { e.preventDefault(); e.stopPropagation(); suppressClick = false; return; }
    if (menu.style.display === 'block' && !menu.contains(e.target)) hideMenu();
  }, true);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') hideMenu(); });

  menu.addEventListener('click', function (e) {
    var b = e.target.closest('button[data-l]');
    if (!b || !current) return;
    var list = b.getAttribute('data-l'), id = current;
    hideMenu();
    HUB.addCourse(id, list).then(function (r) {
      if (r === null) return;
      if (r && r.error) return HUB.toast('Could not save: ' + r.error.message);
      HUB.toast(list === 'library' ? 'Added to Library' : 'Added to Favourite');
    });
  });
  if (!READY) document.addEventListener('DOMContentLoaded', function () { /* menu works once sign-in is connected */ });
})();

</script>
<script>
/* Fills My Library, My Favourite and My Courses. Each page sets data-list and data-heart on <body>. */
(function () {
  var body = document.body, list = body.getAttribute('data-list');
  var ICONS = {"PLAY": "<svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"#fff\"><path d=\"M7 4.5v15l12.5-7.5z\"/></svg>", "REVIEW": "<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#fff\" stroke-width=\"2.6\" stroke-linecap=\"round\"><path d=\"M20 12a8 8 0 1 1-2.4-5.7\"/><path d=\"M20 4v5h-5\"/></svg>", "TRASH": "<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0d1b2a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v6M14 11v6\"/></svg>", "DOTS": "<svg width=\"26\" height=\"26\" viewBox=\"0 0 24 24\" fill=\"#0d1b2a\"><circle cx=\"12\" cy=\"5\" r=\"2.2\"/><circle cx=\"12\" cy=\"12\" r=\"2.2\"/><circle cx=\"12\" cy=\"19\" r=\"2.2\"/></svg>", "SMALLBOOK": "<svg width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0d1b2a\" stroke-width=\"2\" stroke-linejoin=\"round\"><path d=\"M2 5.5C4.6 4 7.8 4 12 5.8V20c-4.2-1.8-7.4-1.8-10 .2zM22 5.5C19.4 4 16.2 4 12 5.8V20c4.2-1.8 7.4-1.8 10 .2z\"/></svg>", "DOC": "<svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0d1b2a\" stroke-width=\"2\" stroke-linejoin=\"round\"><path d=\"M6 2.5h8l4 4V21.5H6z\"/><path d=\"M9 11h6M9 14.5h6M9 18h4\" stroke-linecap=\"round\"/></svg>", "BOOKMARK": "<svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"#0b4d2a\"><path d=\"M6 2.5h12v19l-6-4.6-6 4.6z\"/></svg>", "HEART_RED": "<svg width=\"34\" height=\"34\" viewBox=\"0 0 24 24\" fill=\"#e53935\"><path d=\"M12 21s-7.5-4.6-9.8-9.2C.7 8.4 2.7 4.5 6.6 4.5c2.2 0 3.8 1.2 5.4 3 1.6-1.8 3.2-3 5.4-3 3.9 0 5.9 3.9 4.4 7.3C19.5 16.4 12 21 12 21z\"/></svg>"};
  var grid = document.getElementById('grid'), empty = document.getElementById('empty');
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]; }); }
  function hueOf(t) { var h = 190; String(t).split('').forEach(function (ch) { h = (h + ch.charCodeAt(0) * 7) % 360; }); return h; }
  function card(c) {
    var code = (c.code || (c.title || '').split(' ')[0] || '').toUpperCase();
    var label = c.kind === 'pdf' ? 'PDF' : 'HTML';
    var open = HUB.openLink(c);
    var lessons = c.total || 0;
    var top, acts;
    if (list === 'favourite') {
      top = '<span style="position:absolute;top:14px;right:16px">' + ICONS.HEART_RED + '</span>';
      acts = '<a class="btn dark" href="' + open + '">' + ICONS.PLAY + ' Continue</a>' +
             '<button class="btn out" type="button" data-remove="' + esc(c.id) + '">' + ICONS.TRASH + ' Remove</button>';
    } else if (list === 'library') {
      top = '<span style="position:absolute;top:14px;right:16px">' + ICONS.BOOKMARK + '</span>';
      acts = '<a class="btn dark" href="' + open + '">' + ICONS.PLAY + ' Continue</a>' +
             '<button class="btn out" type="button" data-remove="' + esc(c.id) + '">' + ICONS.TRASH + ' Remove</button>';
    } else {
      top = '<span style="position:absolute;top:12px;right:14px">' + ICONS.DOTS + '</span>';
      acts = '<a class="btn dark" href="' + open + '">' + ICONS.PLAY + ' Continue</a>' +
             '<a class="btn out" href="' + open + '">' + ICONS.DOC + ' Course Details</a>';
    }
    var meta = list === 'courses'
      ? '<div class="meta">' + ICONS.SMALLBOOK + ' ' + lessons + ' lessons</div>'
      : '<div class="meta">' + lessons + ' lessons</div>';
    var prog = list === 'courses' ? '' : '<div class="prog"><div class="bar"><i style="width:0%"></i></div><span class="pct">0%</span></div>';
    return '<article class="card" data-c="' + esc(c.id) + '" data-status="all">' +
      '<div class="cover" style="background:hsl(' + hueOf(c.title) + ' 45% 38%)"><span class="code">' + esc(code) + '</span><span class="sub">' + label + '</span></div>' +
      '<div class="info"><h3 class="title">' + esc(c.title) + '</h3>' + meta + prog + '<div class="acts">' + acts + '</div></div>' +
      top + '</article>';
  }
  function render(items) {
    document.querySelectorAll('#nAll').forEach(function (n) { n.textContent = items.length; });
    document.querySelectorAll('#nProg').forEach(function (n) { n.textContent = 0; });
    document.querySelectorAll('#nDone').forEach(function (n) { n.textContent = 0; });
    grid.innerHTML = items.map(card).join('');
    empty.style.display = items.length ? 'none' : 'block';
  }
  if (!HUB.ready) { empty.textContent = 'Sign-in is not connected yet.'; empty.style.display = 'block'; return; }
  HUB.requireLogin().then(function (u) {
    if (!u) return;
    if (list === 'courses') {
      HUB.profile().then(function (p) {
        var dept = p && p.department;
        return HUB.catalogue().then(function (all) {
          render(all.filter(function (c) {
            if (!c.school) return false;
            var ds = c.depts || [];
            return ds.indexOf(dept) >= 0 || ds.indexOf('general') >= 0;
          }));
        });
      });
      return;
    }
    Promise.all([HUB.listCourses(list), HUB.catalogue()]).then(function (r) {
      var saved = r[0], all = r[1];
      var items = saved.map(function (id) { return all.filter(function (c) { return c.id === id; })[0]; }).filter(Boolean);
      render(items);
      grid.addEventListener('click', function (e) {
        var b = e.target.closest('[data-remove]'); if (!b) return;
        HUB.removeCourse(b.getAttribute('data-remove'), list).then(function () { HUB.toast('Removed'); location.reload(); });
      });
    });
  });
})();

</script></body></html>
