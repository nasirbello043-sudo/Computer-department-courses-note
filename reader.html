<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800;900&family=Inter:wght@400;500;600&family=Merriweather:ital,wght@0,300;0,400;0,700;1,400&family=Fira+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--g:#1b4332;--g2:#2d6a4f;--gold:#c9a84c;--bg:#f4f2ed;--card:#fff;--line:#e2ddd4;--tx:#1a1a1a;--soft:#6b6862;--ok:#2d6a4f;--bad:#b3261e}
*{box-sizing:border-box;margin:0}
body{font:16px/1.65 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--g);border-bottom:3px solid var(--gold);padding:14px 16px;position:sticky;top:0;z-index:5}
header a{color:#fff;text-decoration:none;font:700 1.1rem Nunito,Georgia,serif}
main{max-width:680px;margin:0 auto;padding:18px 16px 60px}
h1{font:700 1.6rem/1.2 Nunito,Georgia,serif;color:var(--g);margin-bottom:6px}
h2{font:700 1.2rem/1.3 Nunito,Georgia,serif;color:var(--g);margin:26px 0 8px}
p{margin-bottom:12px;max-width:70ch}.soft{color:var(--soft);font-size:.9rem}
.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;color:inherit;text-decoration:none}
a.item:active{border-color:var(--g2)}.item.off{opacity:.55}
.bar{height:5px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
pre{background:#15251d;color:#e8f0ea;padding:12px;border-radius:8px;overflow-x:auto;font-size:.85rem;margin-bottom:12px}
.note{background:#fbf3d9;border:1px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:.85rem;margin:10px 0}
dl{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 14px}
dt{font-weight:600;margin-top:8px}dd{color:var(--soft);margin-bottom:8px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px}
.q button{display:block;width:100%;text-align:left;font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}
.q button.ok{background:#dff1e6;border-color:var(--ok)}.q button.bad{background:#f8dcd9;border-color:var(--bad)}
.why{margin-top:8px;font-size:.9rem;color:var(--soft)}
.card{width:100%;min-height:90px;font:inherit;background:var(--g);color:#fff;border:0;border-radius:10px;padding:16px;margin-top:10px;text-align:center}
.card.flip{background:var(--gold);color:#1a1a1a}
.btn{display:inline-block;font:600 1rem Inter,sans-serif;background:var(--g);color:#fff;border:0;border-radius:8px;padding:12px 18px;margin:18px 8px 0 0;text-decoration:none}
.btn.alt{background:none;color:var(--g);border:1px solid var(--g)}
ul,ol{margin:0 0 12px 22px}code{background:#e9e5da;padding:1px 5px;border-radius:4px;font-size:.88em}pre code{background:none;padding:0}.katex-display{overflow-x:auto;overflow-y:hidden}
h3{font:600 1.05rem Inter,sans-serif;color:var(--g);margin:18px 0 6px}hr{border:0;border-top:1px solid var(--line);margin:18px 0}.tw{overflow-x:auto;margin-bottom:12px}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;background:var(--card)}th{background:#e9e5da}.katex-display{margin:.8em 0}
.dg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}.dgt{font:700 1.05rem Nunito,Georgia,serif;color:var(--g);margin-bottom:10px}
.st{list-style:none;margin:0;padding:0}.st li{display:flex;gap:10px;position:relative;padding-bottom:14px}.st li:not(:last-child)::after{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--gold)}
.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--g);color:#fff;font:600 .85rem/28px Inter,sans-serif;text-align:center}.lp{color:var(--g2);font-weight:600;font-size:.9rem}
.cmp,.fc{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cmp>div,.fc>div{background:var(--bg);border-radius:8px;padding:10px;font-size:.9rem}.cmp ul{margin:6px 0 0 16px}.fc>div{display:flex;flex-direction:column}
.big{font:700 1.3rem Nunito,Georgia,serif;color:var(--g)}.pt>div{display:flex;flex-direction:column;padding:8px 0;border-top:1px solid var(--line)}.pt>div:first-child{border-top:0}
.dg svg{width:100%;height:auto;display:block}.gp{fill:none;stroke:var(--g2);stroke-width:2.2}.ax{stroke:var(--soft);stroke-width:1}.gb{fill:none;stroke:var(--line)}.dot{fill:var(--gold);stroke:var(--g);stroke-width:1.5}.dot.open{fill:#fff}.gl{font:11px Inter,sans-serif;fill:var(--soft)}
figure.dg{margin:14px 0}.im img{width:100%;height:auto;border-radius:8px;background:#fff;display:block}.im figcaption{font-weight:600;margin-top:8px}.cr{font-size:.75rem;color:var(--soft);margin-top:4px}.cr a{color:inherit}
.cc{border-left:6px solid hsl(var(--hue) 50% 33%)}.cc .bar i{background:hsl(var(--hue) 50% 40%)}
.mg{display:inline-block;background:hsl(var(--hue) 50% 33%);color:#fff;font:600 .7rem/1 "Fira Mono",monospace;letter-spacing:.1em;border-radius:5px;padding:5px 8px;margin-right:8px;vertical-align:middle}
.chd{background:hsl(var(--hue) 50% 28%);color:#fff;border-radius:12px;padding:18px;margin-bottom:6px}.chd h1{color:#fff;margin:8px 0 4px}.chd p{margin:0;color:#ffffffcc}
.bx{border-left:4px solid var(--c);background:var(--b);padding:12px 15px;border-radius:0 10px 10px 0;margin:16px 0}.bx p{margin:5px 0 0}.bx ol{margin:6px 0 0 20px}.bx .m,.m{font:600 .68rem/1.4 "Fira Mono",monospace;letter-spacing:.12em;text-transform:uppercase}.bx .m{color:var(--c)}
.df{--c:var(--acc);--b:var(--acc2)}.nt{--c:#e8a020;--b:#fff6e0}.lf{--c:#1a4a8a;--b:#e8f1fc}.wr{--c:#c0392b;--b:#fdeceb}.tp{--c:#1d6b3c;--b:#e6f5ec}
body.tbk{background:#fdf8f0}body.tbk header{display:none}body.tbk main{max-width:none;padding:0}
.tb{--acc:hsl(var(--hue) 50% 33%);--acc2:hsl(var(--hue) 55% 94%);--navy:#1e1e1e;--h1:hsl(var(--hue) 50% 22%);--h2:hsl(var(--hue) 45% 38%);--c2:hsl(calc(var(--hue) + 45) 45% 32%);--c3:hsl(calc(var(--hue) + 315) 45% 30%);--c4:#b45309;--g:var(--acc);--g2:var(--h2);--gold:#e8a020;--line:#e3dccb;--card:#fff;--bg:#fdf8f0;--soft:#5a6070;--tx:#1a1a2e;--ok:#1d6b3c;--bad:#c0392b;font:17px/1.8 "Merriweather",Georgia,serif;color:var(--tx);overflow-wrap:anywhere}
.tb h1,.tb h2,.tb h3{font-family:"Nunito",Georgia,serif;line-height:1.2}
.tb .sb{position:fixed;top:0;bottom:0;left:0;width:270px;max-width:82%;background:var(--navy);color:#e4e4ee;overflow:auto;padding:18px 0;z-index:30;transform:translateX(-100%);transition:transform .25s;border-right:3px solid var(--gold)}.tb .sb.o{transform:none}
.tb .br{padding:16px 18px 14px;background:var(--acc)}.tb .br a{color:#fff;opacity:.85;font-size:.8rem;text-decoration:none}.tb .br b{display:block;font:700 1.05rem "Nunito",serif;color:#fff;margin-top:6px}.tb .sb .m{color:#aab;padding:14px 18px 6px}
.tb .sb button,.tb .sb .hm{display:flex;gap:10px;align-items:center;width:100%;text-align:left;font:inherit;font-size:.92rem;color:#e4e4ee;background:none;border:0;border-left:3px solid transparent;padding:10px 18px;min-height:44px;text-decoration:none}
.tb .sb button i{font:600 .72rem "Fira Mono",monospace;font-style:normal;background:#ffffff1c;border-radius:4px;padding:1px 7px}.tb .sb button.on{background:#ffffff14;border-left-color:var(--gold);color:#fff}
.tb .bk{position:fixed;inset:0;background:#0008;z-index:25;display:none}.tb .bk.o{display:block}
.tb .tp{position:sticky;top:0;z-index:20;background:var(--navy);display:flex;align-items:center;gap:12px;padding:8px 14px;color:#fff}.tb .tp button{font:inherit;background:none;border:1px solid var(--gold);color:var(--gold);border-radius:8px;min-width:44px;min-height:40px;font-size:1.1rem}.tb .tp span{font-size:.85rem}
.tb .pb{height:3px;background:#ffffff22;position:sticky;top:56px;z-index:20}.tb .pb i{display:block;height:100%;width:0;background:var(--gold)}
.tb .hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:#fff;padding:32px 20px 28px;position:relative;overflow:hidden}.tb .hero::after{content:attr(data-n);position:absolute;right:12px;top:-26px;font:900 9rem "Nunito",serif;opacity:.13}
.tb .hero .m{color:#ffd98a}.tb .hero h1{font-size:2.3rem;font-weight:900;text-transform:uppercase;letter-spacing:.02em;margin:10px 0;color:#fff}.tb .hero p{margin:0 0 14px;color:#ffffffdd;max-width:46ch}.tb .hero .c{display:inline-block;border:1px solid #ffd98a88;border-radius:99px;padding:3px 12px;margin:0 6px 6px 0;font-size:.8rem}
.tb article{max-width:760px;margin:0 auto;padding:0 18px 80px}.tb section{padding:30px 0 10px;border-bottom:1px dashed var(--line);scroll-margin-top:64px}
.tb section:nth-of-type(4n+1){--sc:var(--acc)}.tb section:nth-of-type(4n+2){--sc:var(--c2)}.tb section:nth-of-type(4n+3){--sc:var(--c3)}.tb section:nth-of-type(4n){--sc:var(--c4)}
.tb .L{display:inline-block;background:var(--sc);color:#fff;font:600 .8rem "Fira Mono",monospace;padding:2px 10px;border-radius:5px}.tb h2{color:var(--sc);font-size:1.55rem;margin:8px 0 12px}.tb h3{font-size:1.1rem;margin:20px 0 4px}
.tb table th{background:var(--sc);color:#fff;font:600 .72rem "Fira Mono",monospace;letter-spacing:.08em;text-transform:uppercase}.tb td,.tb th{border:1px solid var(--line);padding:8px 10px;background:var(--card)}.tb th{background:var(--sc)}
.tb .ex{background:var(--card);border:1px solid #1a4a8a;border-radius:12px;margin:20px 0;overflow:hidden}.tb .ex>.h{background:#1a4a8a;color:#fff;padding:11px 14px;font-weight:600}.tb .ex>.h .m{background:#e8a020;color:#1a1208;border-radius:4px;padding:2px 7px;margin-right:8px}.tb .ex>div{padding:12px 14px}
.tb .gv{border-left:4px solid #1a4a8a;background:#e8f1fc;padding:9px 13px;border-radius:0 8px 8px 0;margin-bottom:10px}.tb .gv .m{color:#1a4a8a}.tb .gv p,.tb .sp p{margin:3px 0 0}
.tb .sp{background:#fff6e0;border:1px solid #e8a020;border-radius:10px;padding:9px 13px;margin:9px 0}.tb .sp .m{color:#b45309}.tb .an{background:#14532d;color:#d1fae5;border-radius:10px;padding:11px 14px;font:600 1rem "Fira Mono",monospace;margin-top:10px}
.tb .qs{background:#f3e5f5;border:2px solid #6a1b9a;border-radius:14px;padding:6px 16px 16px;margin:20px 0}.tb .qs h3{color:#6a1b9a;border-bottom:1px solid #6a1b9a;padding-bottom:8px}.tb .qs details{margin:12px 0}.tb .qs summary{list-style:none;cursor:pointer;min-height:44px}.tb .qs summary b{color:#6a1b9a;margin-right:6px}
.tb .qs summary u{display:inline-block;margin-top:6px;border:1px solid #6a1b9a;color:#6a1b9a;border-radius:99px;padding:4px 14px;font:.72rem "Fira Mono",monospace;text-decoration:none}.tb .qs .ans{margin:8px 0 0;background:#fff;border-left:4px solid #1d6b3c;padding:4px 12px;border-radius:0 8px 8px 0}
.tb dt{font-weight:600;color:var(--acc);margin-top:10px}.tb dd{margin:0}.tb .up{position:fixed;right:14px;bottom:14px;width:44px;height:44px;border-radius:50%;background:var(--gold);color:#1a1208;border:0;font-weight:700;z-index:15}
@media(min-width:900px){.tb .sb{transform:none;width:260px}.tb .tp,.tb .pb,.tb .bk{display:none!important}.tb .tbm{margin-left:260px}.tb article{padding:0 34px 90px}}
.cv{width:100%;height:110px;object-fit:cover;border-radius:8px;margin-bottom:8px;display:block}.cr{font-size:.75rem;color:var(--soft,#6b6862);margin-top:4px}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>

<body>
<header><a href="#/">Learning Hub</a></header>
<main id="app"></main>
<script>
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=async u=>{const r=await fetch(u,{cache:'no-cache'});if(!r.ok)throw new Error(u);return r.json()};
let done={};try{done=JSON.parse(localStorage.getItem('done')||'{}')}catch(e){}
const store=()=>{try{localStorage.setItem('done',JSON.stringify(done))}catch(e){}};
const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
const isItem=x=>/^([-*]|\d+\.)\s+/.test(x);
const table=r=>{const c=l=>l.replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
  const sep=r.length>1&&/^\|?\s*:?-{2,}/.test(r[1]),head=sep?c(r[0]):null,body=r.slice(sep?2:0).map(c);
  return'<div class="tw"><table>'+(head?'<tr>'+head.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr>':'')+
  body.map(x=>'<tr>'+x.map(y=>'<td>'+inline(y)+'</td>').join('')+'</tr>').join('')+'</table></div>'};
const blocks=t=>{const L=t.split('\n'),out=[];let i=0,para=[];
  const flush=()=>{if(para.length){out.push('<p>'+inline(para.join(' '))+'</p>');para=[]}};
  while(i<L.length){const l=L[i].trim();
    if(!l){flush();i++;continue}
    if(/^-{3,}$/.test(l)){flush();out.push('<hr>');i++;continue}
    if(l[0]==='>'){flush();const q=[];while(i<L.length&&L[i].trim()[0]==='>'){q.push(L[i].trim().replace(/^>\s?/,''));i++}
      const t=q.join(' '),m=t.match(/^\*\*([^*]+?):?\*\*:?\s*(.*)$/),lab=m?m[1]:'Note',k=/defin/i.test(lab)?'df':/mistake|warn|careful/i.test(lab)?'wr':/life|farm|real|everyday|example/i.test(lab)?'lf':/remember|tip|key/i.test(lab)?'tp':'nt';
      out.push(`<div class="bx ${k}"><span class="m">${esc(lab)}</span><p>${inline(m?m[2]:t)}</p></div>`);continue}
    let m=l.match(/^#{1,6}\s+(.+)$/);
    if(m){flush();out.push('<h3>'+inline(m[1])+'</h3>');i++;continue}
    if(/^\|.*\|/.test(l)){flush();const r=[];while(i<L.length&&/^\|.*\|/.test(L[i].trim())){r.push(L[i].trim());i++}out.push(table(r));continue}
    if(isItem(l)){flush();const ord=/^\d/.test(l),start=parseInt(l)||1,items=[];
      while(i<L.length){const x=L[i].trim();
        if(isItem(x)&&/^\d/.test(x)===ord){items.push(x.replace(/^([-*]|\d+\.)\s+/,''));i++}
        else if(x&&items.length&&!isItem(x)&&!/^(#{1,6}\s|-{3,}$|\|)/.test(x)){items[items.length-1]+=' '+x;i++}
        else break}
      out.push((ord?`<ol start="${start}">`:'<ul>')+items.map(x=>'<li>'+inline(x)+'</li>').join('')+(ord?'</ol>':'</ul>'));continue}
    para.push(l);i++}
  flush();return out.join('')};
const dropT=(b,t)=>{const m=String(b).match(/^\s*(?:#+\s*)?\**([^\n]+?)\**\s*\n/);return m&&m[1].trim().toLowerCase()===String(t).trim().toLowerCase()?String(b).slice(m[0].length):b};
const md=s=>String(s==null?'':s).split(/```\w*\n?([\s\S]*?)```/).map((t,i)=>i%2?`<pre><code>${esc(t)}</code></pre>`:blocks(t)).join('');
const math=(el=app)=>{if(window.renderMathInElement)renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],throwOnError:false})};
const count=id=>Object.keys(done).filter(k=>k.startsWith(id+'/')).length;

const SAFE=['x','sin','cos','tan','sqrt','abs','ln','log','exp','pi','e'];
const mkfn=s=>{s=String(s).toLowerCase().replace(/\^/g,'**').replace(/\bln\b/g,'log');
  s=s.replace(/(\d|\))\s*(x|\(|[a-z]{2,})/g,'$1*$2').replace(/\bx\s*(\(|x)/g,'x*$1').replace(/\)\s*x/g,')*x');
  if(!/^[0-9a-z+\-*/().,\s]+$/.test(s)||(s.match(/[a-z]+/g)||[]).some(i=>!SAFE.includes(i)))return null;
  try{return new Function('x','const {sin,cos,tan,sqrt,abs,log,exp,PI:pi,E:e}=Math;return '+s)}catch(e){return null}};
const graph=d=>{const f=mkfn(d.fn),x0=+d.xmin,x1=+d.xmax;if(!f||!(x1>x0))return'';
  const pts=[];for(let i=0;i<=300;i++){const x=x0+(x1-x0)*i/300;let y;try{y=f(x)}catch(e){y=NaN}pts.push([x,y])}
  const ys=pts.map(p=>p[1]).filter(Number.isFinite).sort((a,b)=>a-b);if(ys.length<10)return'';
  let lo=ys[Math.floor(ys.length*.02)],hi=ys[Math.ceil(ys.length*.98)-1];const P=(d.points||[]).filter(p=>Number.isFinite(+p.x)&&Number.isFinite(+p.y));
  P.forEach(p=>{lo=Math.min(lo,+p.y);hi=Math.max(hi,+p.y)});if(hi-lo<1e-9){lo-=1;hi+=1}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const W=320,H=220,m=24,sx=x=>m+(x-x0)/(x1-x0)*(W-2*m),sy=y=>H-m-(y-lo)/(hi-lo)*(H-2*m);
  let path='',pen=false,prev=null;
  pts.forEach(([x,y])=>{if(!(Number.isFinite(y)&&y>=lo&&y<=hi)){pen=false;prev=null;return}
    if(prev!==null&&Math.abs(y-prev)>(hi-lo)*.5)pen=false;path+=(pen?'L':'M')+sx(x).toFixed(1)+' '+sy(y).toFixed(1);pen=true;prev=y});
  const ax=(lo<=0&&hi>=0?`<line x1="${m}" x2="${W-m}" y1="${sy(0)}" y2="${sy(0)}" class="ax"/>`:'')+(x0<=0&&x1>=0?`<line y1="${m}" y2="${H-m}" x1="${sx(0)}" x2="${sx(0)}" class="ax"/>`:'');
  const dots=P.map(p=>`<circle cx="${sx(+p.x)}" cy="${sy(+p.y)}" r="4.5" class="dot${p.open?' open':''}"/>${p.label?`<text x="${Math.min(sx(+p.x)+8,W-4)}" y="${sy(+p.y)-8}" class="gl">${esc(p.label)}</text>`:''}`).join('');
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.title||'Graph')}"><rect x="${m}" y="${m}" width="${W-2*m}" height="${H-2*m}" class="gb"/>${ax}<path d="${path}" class="gp"/>${dots}<text x="${m}" y="${H-8}" class="gl">${x0}</text><text x="${W-m}" y="${H-8}" class="gl" text-anchor="end">${x1}</text></svg>`};
const EXT=['png','jpg','jpeg','webp','svg'];
const diagram=d=>{const t=`<div class="dg"><div class="dgt">${esc(d.title||'')}</div>`;
  if(d.type==='image'){if(!/^[a-z0-9-]+$/.test(d.file||''))return'';
    return`<figure class="dg im" hidden><a target="_blank" rel="noopener"><img data-b="${esc(d.file)}" alt="${esc(d.alt||d.title||'')}"></a><figcaption>${esc(d.title||'')}</figcaption>${d.ai?`<div class="cr">AI-generated</div>`:''}</figure>`}
  if(d.type==='steps')return t+'<ol class="st">'+d.steps.map((s,i)=>`<li><span class="n">${i+1}</span><div><b>${inline(s.label)}</b>${s.text?`<div class="soft">${inline(s.text)}</div>`:''}</div></li>`).join('')+'</ol>'+(d.loop?'<div class="lp">&#8635; then it repeats from step 1</div>':'')+'</div>';
  if(d.type==='compare')return t+'<div class="cmp">'+['left','right'].map(k=>`<div><b>${inline(d[k].name)}</b><ul>${d[k].points.map(p=>`<li>${inline(p)}</li>`).join('')}</ul></div>`).join('')+'</div></div>';
  if(d.type==='facts')return t+'<div class="fc">'+d.items.map(i=>`<div><span class="big">${inline(i.value)}</span><span class="soft">${inline(i.label)}</span></div>`).join('')+'</div></div>';
  if(d.type==='parts')return t+'<div class="pt">'+d.items.map(i=>`<div><b>${inline(i.name)}</b><span class="soft">${inline(i.role||'')}</span></div>`).join('')+'</div></div>';
  if(d.type==='graph'){const g=graph(d);return g?t+g+(d.caption?`<p class="soft">${inline(d.caption)}</p>`:'')+'</div>':''}
  return''};
const loadImgs=()=>app.querySelectorAll('.im img[data-b]').forEach(img=>{const f=img.closest('figure'),b=img.dataset.b;let i=0;
  const t=new Image(),go=()=>{t.src=`courses/images/${b}.${EXT[i]}`};
  t.onload=()=>{img.src=t.src;img.closest('a').href=t.src;f.hidden=false};
  t.onerror=()=>{if(++i<EXT.length)go();else f.remove()};go()});
const dgs=(d,si)=>(d.diagrams||[]).filter(x=>(Number.isInteger(x.after)?Math.min(Math.max(x.after,0),d.sections.length-1):d.sections.length-1)===si).map(x=>{try{return diagram(x)}catch(e){return''}}).join('');
let io=null;
const th=(c,id)=>{const t=(c&&c.theme)||{};let x=t.hue;if(!Number.isFinite(x)){x=0;for(const ch of id)x=(x*31+ch.charCodeAt(0))%360}return{hue:x,code:t.code||id.replace(/[^a-z]/g,'').slice(0,3).toUpperCase()}};
const wire=(id,n)=>{app.querySelectorAll('.q').forEach(q=>q.onclick=e=>{const b=e.target.closest('button');if(!b||q.dataset.done)return;
    q.dataset.done=1;const a=+q.dataset.a;b.classList.add(+b.dataset.o===a?'ok':'bad');
    q.querySelectorAll('button')[a].classList.add('ok');q.querySelector('.why').hidden=false});
  app.querySelectorAll('.card').forEach(b=>b.onclick=()=>{const f=b.classList.toggle('flip');b.textContent=f?b.dataset.b:b.dataset.f;math(b)});
  document.getElementById('fin').onclick=e=>{done[id+'/'+n]=1;store();e.target.textContent='Finished'}};
const pgf=()=>{const p=document.getElementById('pg');if(p){const h=document.documentElement;p.style.width=Math.min(100,scrollY/(h.scrollHeight-innerHeight)*100)+'%'}};addEventListener('scroll',pgf,{passive:true});
const exH=(e,i)=>`<div class="ex"><div class="h"><span class="m">EX ${i+1}${e.level?' · '+esc(e.level):''}</span>${inline(e.title)}</div><div><div class="gv"><span class="m">Given</span><p>${inline(e.given)}</p></div>${(e.steps||[]).map((s,k)=>`<div class="sp"><span class="m">Step ${k+1} · ${inline(s.label)}</span><p>${inline(s.text)}</p></div>`).join('')}<div class="an">&#10003; ${inline(e.answer)}</div></div></div>`;
const prH=d=>`<div class="qs"><h3>Practice questions</h3><p>Try each question first, then tap Show answer.</p>${d.practice.map((p,i)=>`<details><summary><b>Q${i+1}${p.level?' · '+esc(p.level):''}</b>${inline(p.q)}<br><u>Show answer</u></summary><div class="ans">${md(p.a)}</div></details>`).join('')}</div>`;
async function lessonV2(c,id,n,d){
  const t=th(c,id),L=i=>String.fromCharCode(65+i),S=[],words=d.sections.reduce((a,s)=>a+String(s.body).split(/\s+/).length,0);
  S.push(['Objectives',`<p>Read these first. They tell you exactly what this lesson will teach you, so you can check yourself at the end.</p><div class="bx df"><span class="m">By the end you can</span><ol>${d.objectives.map(o=>`<li>${inline(o)}</li>`).join('')}</ol></div>${d.prerequisites?`<div class="bx tp"><span class="m">Before you start</span><p>${inline(d.prerequisites)}</p></div>`:''}`]);
  if(d.why)S.push(['Why it matters',[].concat(d.why).map(p=>`<p>${inline(p)}</p>`).join('')]);
  d.sections.forEach((s,si)=>S.push([s.heading,md(dropT(s.body,s.heading))+(s.code?`<pre><code>${esc(s.code)}</code></pre>`:'')+dgs(d,si)]));
  if((d.examples||[]).length)S.push(['Worked examples','<p>We start easy, then make it harder. Read every step, and try to cover the next one before you look.</p>'+d.examples.map(exH).join('')]);
  if((d.practice||[]).length)S.push(['Practice questions',prH(d)]);
  S.push(['Summary and key terms',(d.recap?`<div class="bx df"><span class="m">Summary</span>${md(d.recap)}</div>`:'')+`<dl>${(d.key_terms||[]).map(k=>`<dt>${inline(k.term)}</dt><dd>${inline(k.meaning)}</dd>`).join('')}</dl>`]);
  S.push(['Quiz and flashcards',`${(d.quiz||[]).map(q=>`<div class="q" data-a="${q.answer}"><b>${inline(q.q)}</b>${q.options.map((o,oi)=>`<button data-o="${oi}">${inline(o)}</button>`).join('')}<div class="why" hidden>${inline(q.why)}</div></div>`).join('')}<p class="m" style="margin-top:22px;color:var(--soft)">Flashcards · tap to flip</p>${(d.flashcards||[]).map(f=>`<button class="card" data-f="${esc(f.front)}" data-b="${esc(f.back)}">${esc(f.front)}</button>`).join('')}<button class="btn" id="fin">${done[id+'/'+n]?'Finished':'Mark as finished'}</button>${c.lessons[n]&&c.lessons[n].file?`<a class="btn alt" href="#/c/${id}/${n+1}">Next lesson</a>`:''}`]);
  document.body.classList.add('tbk');
  app.innerHTML=`<div class="tb" style="--hue:${t.hue}"><aside class="sb"><div class="br"><a href="#/c/${id}">&larr; ${esc(c.title)}</a><b>${esc(d.title)}</b></div><div class="m">Contents</div>${S.map((s,i)=>`<button data-t="s${i}"><i>${L(i)}</i>${esc(s[0])}</button>`).join('')}<a class="hm" href="#/">All courses</a></aside><div class="bk"></div>
  <div class="tbm"><div class="tp"><button id="mb" aria-label="Open contents">&#9776;</button><span>${esc(c.title)} · Lesson ${n}</span></div><div class="pb"><i id="pg"></i></div>
  <div class="hero" data-n="${n}" style="background-image:linear-gradient(135deg,hsl(${t.hue} 50% 22% / .9),hsl(${t.hue} 45% 38% / .86)),url(courses/images/cover-${id}.jpg);background-size:cover;background-position:center"><span class="m">${esc(t.code)} · Lesson ${n}</span><h1>${esc(d.title)}</h1><p>${esc(d.summary||'')}</p><span class="c">${Math.max(5,Math.round(words/170))} min</span><span class="c">${S.length} sections</span>${(d.examples||[]).length?`<span class="c">${d.examples.length} worked examples</span>`:''}${(d.practice||[]).length?`<span class="c">${d.practice.length} practice questions</span>`:''}</div>
  <article>${S.map((s,i)=>`<section id="s${i}"><span class="L">${L(i)}</span><h2>${esc(s[0])}</h2>${s[1]}</section>`).join('')}</article></div><button class="up" aria-label="Back to top">&uarr;</button></div>`;
  const sb=app.querySelector('.sb'),bk=app.querySelector('.bk'),tg=o=>{sb.classList.toggle('o',o);bk.classList.toggle('o',o)};
  app.querySelector('#mb').onclick=()=>tg(true);bk.onclick=()=>tg(false);app.querySelector('.up').onclick=()=>scrollTo({top:0,behavior:'smooth'});
  app.querySelectorAll('.sb [data-t]').forEach(a=>a.onclick=()=>{tg(false);document.getElementById(a.dataset.t).scrollIntoView({behavior:'smooth'})});
  if(io)io.disconnect();io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting)app.querySelectorAll('.sb [data-t]').forEach(a=>a.classList.toggle('on',a.dataset.t===e.target.id))}),{rootMargin:'-30% 0px -60% 0px'});
  app.querySelectorAll('.tb section').forEach(s=>io.observe(s));
  wire(id,n);math();loadImgs();pgf();
}
async function home(){
  const list=await get('courses/index.json');
  app.innerHTML='<h1>Courses</h1><p class="soft">Pick a course and work through it lesson by lesson.</p>'+
    (list.length?list.map(c=>{const t=th(c,c.id);return`<a class="item cc" style="--hue:${t.hue}" href="#/c/${esc(c.id)}"><img class="cv" src="courses/images/cover-${esc(c.id)}.jpg" alt="" onerror="this.remove()"><span class="mg">${esc(t.code)}</span><b>${esc(c.title)}</b>
    <div class="soft">${c.ready} of ${c.total} lessons ready</div>
    <div class="bar"><i style="width:${c.total?count(c.id)/c.total*100:0}%"></i></div></a>`}).join('')
    :'<p class="note">No courses yet. Run the "Generate lessons" action in GitHub, then refresh.</p>');
}

async function course(id){
  const c=await get(`courses/${id}/course.json`);
  const t=th(c,id);app.innerHTML=`<div class="chd" style="--hue:${t.hue};background-image:linear-gradient(hsl(${t.hue} 50% 28% / .85),hsl(${t.hue} 50% 24% / .95)),url(courses/images/cover-${id}.jpg);background-size:cover;background-position:center"><span class="mg" style="background:#fff;color:hsl(var(--hue) 50% 28%)">${esc(t.code)}</span><h1>${esc(c.title)}</h1><p>${count(id)} of ${c.lessons.length} lessons finished</p></div>`+
    c.lessons.map((l,i)=>l.file?`<a class="item cc" style="--hue:${t.hue}" href="#/c/${id}/${i+1}"><b>${i+1}. ${esc(l.title)}</b>${done[id+'/'+(i+1)]?' <span class="soft">Finished</span>':''}</a>`
    :`<div class="item off">${i+1}. ${esc(l.title)}<div class="soft">Not written yet</div></div>`).join('');
}

async function lesson(id,n){
  const c=await get(`courses/${id}/course.json`),meta=c.lessons[n-1];
  if(!meta||!meta.file)return app.innerHTML='<p class="note">This lesson is not ready yet.</p>';
  const d=await get(`courses/${id}/${meta.file}`);
  if(d.objectives)return lessonV2(c,id,n,d);
  app.innerHTML=`<p class="soft"><a href="#/c/${id}">${esc(c.title)}</a> / Lesson ${n}</p><h1>${esc(d.title)}</h1>
  
  <p>${esc(d.summary)}</p>
  ${d.sections.map((s,si)=>`<h2>${esc(s.heading)}</h2>${md(dropT(s.body,s.heading))}${s.code?`<pre><code>${esc(s.code)}</code></pre>`:''}${dgs(d,si)}`).join('')}
  <h2>Key terms</h2><dl>${(d.key_terms||[]).map(k=>`<dt>${esc(k.term)}</dt><dd>${esc(k.meaning)}</dd>`).join('')}</dl>
  <h2>Quick quiz</h2>${d.quiz.map((q,qi)=>`<div class="q" data-a="${q.answer}"><b>${esc(q.q)}</b>
    ${q.options.map((o,oi)=>`<button data-o="${oi}">${esc(o)}</button>`).join('')}<div class="why" hidden>${esc(q.why)}</div></div>`).join('')}
  <h2>Flashcards</h2><p class="soft">Tap a card to flip it.</p>
  ${d.flashcards.map(f=>`<button class="card" data-f="${esc(f.front)}" data-b="${esc(f.back)}">${esc(f.front)}</button>`).join('')}
  <button class="btn" id="fin">${done[id+'/'+n]?'Finished':'Mark as finished'}</button>
  ${c.lessons[n]&&c.lessons[n].file?`<a class="btn alt" href="#/c/${id}/${n+1}">Next lesson</a>`:''}`;
  wire(id,n);
  math();loadImgs();
}

async function route(){
  document.body.classList.remove('tbk');const p=location.hash.slice(2).split('/');window.scrollTo(0,0);
  try{ if(p[0]==='c'&&p[2])await lesson(p[1],+p[2]); else if(p[0]==='c'&&p[1])await course(p[1]); else await home(); }
  catch(e){app.innerHTML='<p class="note">Could not load this page. Check your connection and try again.</p>'}
}
addEventListener('hashchange',route);addEventListener('load',()=>math());route();
</script>
</body>
</html>
