<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Learning Hub</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<style>
:root{--g:#1b4332;--g2:#2d6a4f;--gold:#c9a84c;--bg:#f4f2ed;--card:#fff;--line:#e2ddd4;--tx:#1a1a1a;--soft:#6b6862;--ok:#2d6a4f;--bad:#b3261e}
*{box-sizing:border-box;margin:0}
body{font:16px/1.65 Inter,system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{background:var(--g);border-bottom:3px solid var(--gold);padding:14px 16px;position:sticky;top:0;z-index:5}
header a{color:#fff;text-decoration:none;font:700 1.1rem Playfair Display,Georgia,serif}
main{max-width:680px;margin:0 auto;padding:18px 16px 60px}
h1{font:700 1.6rem/1.2 Playfair Display,Georgia,serif;color:var(--g);margin-bottom:6px}
h2{font:700 1.2rem/1.3 Playfair Display,Georgia,serif;color:var(--g);margin:26px 0 8px}
p{margin-bottom:12px;max-width:70ch}.soft{color:var(--soft);font-size:.9rem}
.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px;color:inherit;text-decoration:none}
a.item:active{border-color:var(--g2)}.item.off{opacity:.55}
.bar{height:5px;background:var(--line);border-radius:9px;margin-top:8px;overflow:hidden}.bar i{display:block;height:100%;background:var(--gold)}
pre{background:#15251d;color:#e8f0ea;padding:12px;border-radius:8px;overflow-x:auto;font-size:.85rem;margin-bottom:12px}
.note{background:#fbf3d9;border:1px solid var(--gold);border-radius:8px;padding:8px 12px;font-size:.85rem;margin:10px 0}
dl{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:6px 14px}
dt{font-weight:600;margin-top:8px}dd{color:var(--soft);margin-bottom:8px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-top:10px}
.q button{display:block;width:100%;text-align:left;font:inherit;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}
.q button.ok{background:#dff1e6;border-color:var(--ok)}.q button.bad{background:#f8dcd9;border-color:var(--bad)}
.why{margin-top:8px;font-size:.9rem;color:var(--soft)}
.card{width:100%;min-height:90px;font:inherit;background:var(--g);color:#fff;border:0;border-radius:10px;padding:16px;margin-top:10px;text-align:center}
.card.flip{background:var(--gold);color:#1a1a1a}
.btn{display:inline-block;font:600 1rem Inter,sans-serif;background:var(--g);color:#fff;border:0;border-radius:8px;padding:12px 18px;margin:18px 8px 0 0;text-decoration:none}
.btn.alt{background:none;color:var(--g);border:1px solid var(--g)}
ul,ol{margin:0 0 12px 22px}code{background:#e9e5da;padding:1px 5px;border-radius:4px;font-size:.88em}pre code{background:none;padding:0}.katex-display{overflow-x:auto;overflow-y:hidden}
h3{font:600 1.05rem Inter,sans-serif;color:var(--g);margin:18px 0 6px}hr{border:0;border-top:1px solid var(--line);margin:18px 0}.tw{overflow-x:auto;margin-bottom:12px}table{border-collapse:collapse;width:100%;font-size:.9rem}th,td{border:1px solid var(--line);padding:6px 8px;text-align:center;background:var(--card)}th{background:#e9e5da}.katex-display{margin:.8em 0}
.dg{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin:14px 0}.dgt{font:700 1.05rem Playfair Display,Georgia,serif;color:var(--g);margin-bottom:10px}
.st{list-style:none;margin:0;padding:0}.st li{display:flex;gap:10px;position:relative;padding-bottom:14px}.st li:not(:last-child)::after{content:"";position:absolute;left:13px;top:30px;bottom:2px;width:2px;background:var(--gold)}
.n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--g);color:#fff;font:600 .85rem/28px Inter,sans-serif;text-align:center}.lp{color:var(--g2);font-weight:600;font-size:.9rem}
.cmp,.fc{display:grid;grid-template-columns:1fr 1fr;gap:10px}.cmp>div,.fc>div{background:var(--bg);border-radius:8px;padding:10px;font-size:.9rem}.cmp ul{margin:6px 0 0 16px}.fc>div{display:flex;flex-direction:column}
.big{font:700 1.3rem Playfair Display,Georgia,serif;color:var(--g)}.pt>div{display:flex;flex-direction:column;padding:8px 0;border-top:1px solid var(--line)}.pt>div:first-child{border-top:0}
.dg svg{width:100%;height:auto;display:block}.gp{fill:none;stroke:var(--g2);stroke-width:2.2}.ax{stroke:var(--soft);stroke-width:1}.gb{fill:none;stroke:var(--line)}.dot{fill:var(--gold);stroke:var(--g);stroke-width:1.5}.dot.open{fill:#fff}.gl{font:11px Inter,sans-serif;fill:var(--soft)}
:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
</style>
</head>
<body>
<header><a href="#/">Learning Hub</a></header>
<main id="app"></main>
<script>
const app=document.getElementById('app');
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const get=async u=>{const r=await fetch(u);if(!r.ok)throw new Error(u);return r.json()};
let done={};try{done=JSON.parse(localStorage.getItem('done')||'{}')}catch(e){}
const store=()=>{try{localStorage.setItem('done',JSON.stringify(done))}catch(e){}};
const inline=t=>esc(t).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>').replace(/`([^`]+)`/g,'<code>$1</code>');
const isItem=x=>/^([-*]|\d+\.)\s+/.test(x);
const table=r=>{const c=l=>l.replace(/^\||\|$/g,'').split('|').map(x=>x.trim());
  const sep=r.length>1&&/^\|?\s*:?-{2,}/.test(r[1]),head=sep?c(r[0]):null,body=r.slice(sep?2:0).map(c);
  return'<div class="tw"><table>'+(head?'<tr>'+head.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr>':'')+
  body.map(x=>'<tr>'+x.map(y=>'<td>'+inline(y)+'</td>').join('')+'</tr>').join('')+'</table></div>'};
const blocks=t=>{const L=t.split('\n'),out=[];let i=0,para=[];
  const flush=()=>{if(para.length){out.push('<p>'+inline(para.join(' '))+'</p>');para=[]}};
  while(i<L.length){const l=L[i].trim();
    if(!l){flush();i++;continue}
    if(/^-{3,}$/.test(l)){flush();out.push('<hr>');i++;continue}
    let m=l.match(/^#{1,6}\s+(.+)$/);
    if(m){flush();out.push('<h3>'+inline(m[1])+'</h3>');i++;continue}
    if(/^\|.*\|/.test(l)){flush();const r=[];while(i<L.length&&/^\|.*\|/.test(L[i].trim())){r.push(L[i].trim());i++}out.push(table(r));continue}
    if(isItem(l)){flush();const ord=/^\d/.test(l),start=parseInt(l)||1,items=[];
      while(i<L.length){const x=L[i].trim();
        if(isItem(x)&&/^\d/.test(x)===ord){items.push(x.replace(/^([-*]|\d+\.)\s+/,''));i++}
        else if(x&&items.length&&!isItem(x)&&!/^(#{1,6}\s|-{3,}$|\|)/.test(x)){items[items.length-1]+=' '+x;i++}
        else break}
      out.push((ord?`<ol start="${start}">`:'<ul>')+items.map(x=>'<li>'+inline(x)+'</li>').join('')+(ord?'</ol>':'</ul>'));continue}
    para.push(l);i++}
  flush();return out.join('')};
const dropT=(b,t)=>{const m=String(b).match(/^\s*(?:#+\s*)?\**([^\n]+?)\**\s*\n/);return m&&m[1].trim().toLowerCase()===String(t).trim().toLowerCase()?String(b).slice(m[0].length):b};
const md=s=>String(s==null?'':s).split(/```\w*\n?([\s\S]*?)```/).map((t,i)=>i%2?`<pre><code>${esc(t)}</code></pre>`:blocks(t)).join('');
const math=(el=app)=>{if(window.renderMathInElement)renderMathInElement(el,{delimiters:[{left:'$$',right:'$$',display:true},{left:'\\[',right:'\\]',display:true},{left:'\\(',right:'\\)',display:false},{left:'$',right:'$',display:false}],throwOnError:false})};
const count=id=>Object.keys(done).filter(k=>k.startsWith(id+'/')).length;

const SAFE=['x','sin','cos','tan','sqrt','abs','ln','log','exp','pi','e'];
const mkfn=s=>{s=String(s).toLowerCase().replace(/\^/g,'**').replace(/\bln\b/g,'log');
  s=s.replace(/(\d|\))\s*(x|\(|[a-z]{2,})/g,'$1*$2').replace(/\bx\s*(\(|x)/g,'x*$1').replace(/\)\s*x/g,')*x');
  if(!/^[0-9a-z+\-*/().,\s]+$/.test(s)||(s.match(/[a-z]+/g)||[]).some(i=>!SAFE.includes(i)))return null;
  try{return new Function('x','const {sin,cos,tan,sqrt,abs,log,exp,PI:pi,E:e}=Math;return '+s)}catch(e){return null}};
const graph=d=>{const f=mkfn(d.fn),x0=+d.xmin,x1=+d.xmax;if(!f||!(x1>x0))return'';
  const pts=[];for(let i=0;i<=300;i++){const x=x0+(x1-x0)*i/300;let y;try{y=f(x)}catch(e){y=NaN}pts.push([x,y])}
  const ys=pts.map(p=>p[1]).filter(Number.isFinite).sort((a,b)=>a-b);if(ys.length<10)return'';
  let lo=ys[Math.floor(ys.length*.02)],hi=ys[Math.ceil(ys.length*.98)-1];const P=(d.points||[]).filter(p=>Number.isFinite(+p.x)&&Number.isFinite(+p.y));
  P.forEach(p=>{lo=Math.min(lo,+p.y);hi=Math.max(hi,+p.y)});if(hi-lo<1e-9){lo-=1;hi+=1}const pad=(hi-lo)*.12;lo-=pad;hi+=pad;
  const W=320,H=220,m=24,sx=x=>m+(x-x0)/(x1-x0)*(W-2*m),sy=y=>H-m-(y-lo)/(hi-lo)*(H-2*m);
  let path='',pen=false,prev=null;
  pts.forEach(([x,y])=>{if(!(Number.isFinite(y)&&y>=lo&&y<=hi)){pen=false;prev=null;return}
    if(prev!==null&&Math.abs(y-prev)>(hi-lo)*.5)pen=false;path+=(pen?'L':'M')+sx(x).toFixed(1)+' '+sy(y).toFixed(1);pen=true;prev=y});
  const ax=(lo<=0&&hi>=0?`<line x1="${m}" x2="${W-m}" y1="${sy(0)}" y2="${sy(0)}" class="ax"/>`:'')+(x0<=0&&x1>=0?`<line y1="${m}" y2="${H-m}" x1="${sx(0)}" x2="${sx(0)}" class="ax"/>`:'');
  const dots=P.map(p=>`<circle cx="${sx(+p.x)}" cy="${sy(+p.y)}" r="4.5" class="dot${p.open?' open':''}"/>${p.label?`<text x="${Math.min(sx(+p.x)+8,W-4)}" y="${sy(+p.y)-8}" class="gl">${esc(p.label)}</text>`:''}`).join('');
  return`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(d.title||'Graph')}"><rect x="${m}" y="${m}" width="${W-2*m}" height="${H-2*m}" class="gb"/>${ax}<path d="${path}" class="gp"/>${dots}<text x="${m}" y="${H-8}" class="gl">${x0}</text><text x="${W-m}" y="${H-8}" class="gl" text-anchor="end">${x1}</text></svg>`};
const diagram=d=>{const t=`<div class="dg"><div class="dgt">${esc(d.title||'')}</div>`;
  if(d.type==='steps')return t+'<ol class="st">'+d.steps.map((s,i)=>`<li><span class="n">${i+1}</span><div><b>${inline(s.label)}</b>${s.text?`<div class="soft">${inline(s.text)}</div>`:''}</div></li>`).join('')+'</ol>'+(d.loop?'<div class="lp">&#8635; then it repeats from step 1</div>':'')+'</div>';
  if(d.type==='compare')return t+'<div class="cmp">'+['left','right'].map(k=>`<div><b>${inline(d[k].name)}</b><ul>${d[k].points.map(p=>`<li>${inline(p)}</li>`).join('')}</ul></div>`).join('')+'</div></div>';
  if(d.type==='facts')return t+'<div class="fc">'+d.items.map(i=>`<div><span class="big">${inline(i.value)}</span><span class="soft">${inline(i.label)}</span></div>`).join('')+'</div></div>';
  if(d.type==='parts')return t+'<div class="pt">'+d.items.map(i=>`<div><b>${inline(i.name)}</b><span class="soft">${inline(i.role||'')}</span></div>`).join('')+'</div></div>';
  if(d.type==='graph'){const g=graph(d);return g?t+g+(d.caption?`<p class="soft">${inline(d.caption)}</p>`:'')+'</div>':''}
  return''};
const dgs=(d,si)=>(d.diagrams||[]).filter(x=>(Number.isInteger(x.after)?Math.min(Math.max(x.after,0),d.sections.length-1):d.sections.length-1)===si).map(x=>{try{return diagram(x)}catch(e){return''}}).join('');
async function home(){
  const list=await get('courses/index.json');
  app.innerHTML='<h1>Courses</h1><p class="soft">Pick a course and work through it lesson by lesson.</p>'+
    (list.length?list.map(c=>`<a class="item" href="#/c/${esc(c.id)}"><b>${esc(c.title)}</b>
    <div class="soft">${c.ready} of ${c.total} lessons ready</div>
    <div class="bar"><i style="width:${c.total?count(c.id)/c.total*100:0}%"></i></div></a>`).join('')
    :'<p class="note">No courses yet. Run the "Generate lessons" action in GitHub, then refresh.</p>');
}

async function course(id){
  const c=await get(`courses/${id}/course.json`);
  app.innerHTML=`<h1>${esc(c.title)}</h1><p class="soft">${count(id)} of ${c.lessons.length} lessons finished</p>`+
    c.lessons.map((l,i)=>l.file?`<a class="item" href="#/c/${id}/${i+1}"><b>${i+1}. ${esc(l.title)}</b>${done[id+'/'+(i+1)]?' <span class="soft">Finished</span>':''}</a>`
    :`<div class="item off">${i+1}. ${esc(l.title)}<div class="soft">Not written yet</div></div>`).join('');
}

async function lesson(id,n){
  const c=await get(`courses/${id}/course.json`),meta=c.lessons[n-1];
  if(!meta||!meta.file)return app.innerHTML='<p class="note">This lesson is not ready yet.</p>';
  const d=await get(`courses/${id}/${meta.file}`);
  app.innerHTML=`<p class="soft"><a href="#/c/${id}">${esc(c.title)}</a> / Lesson ${n}</p><h1>${esc(d.title)}</h1>
  ${d.reviewed?'':'<div class="note">This lesson has not been checked by a teacher yet.</div>'}
  <p>${esc(d.summary)}</p>
  ${d.sections.map((s,si)=>`<h2>${esc(s.heading)}</h2>${md(dropT(s.body,s.heading))}${s.code?`<pre><code>${esc(s.code)}</code></pre>`:''}${dgs(d,si)}`).join('')}
  <h2>Key terms</h2><dl>${(d.key_terms||[]).map(k=>`<dt>${esc(k.term)}</dt><dd>${esc(k.meaning)}</dd>`).join('')}</dl>
  <h2>Quick quiz</h2>${d.quiz.map((q,qi)=>`<div class="q" data-a="${q.answer}"><b>${esc(q.q)}</b>
    ${q.options.map((o,oi)=>`<button data-o="${oi}">${esc(o)}</button>`).join('')}<div class="why" hidden>${esc(q.why)}</div></div>`).join('')}
  <h2>Flashcards</h2><p class="soft">Tap a card to flip it.</p>
  ${d.flashcards.map(f=>`<button class="card" data-f="${esc(f.front)}" data-b="${esc(f.back)}">${esc(f.front)}</button>`).join('')}
  <button class="btn" id="fin">${done[id+'/'+n]?'Finished':'Mark as finished'}</button>
  ${c.lessons[n]&&c.lessons[n].file?`<a class="btn alt" href="#/c/${id}/${n+1}">Next lesson</a>`:''}`;
  app.querySelectorAll('.q').forEach(q=>q.onclick=e=>{const b=e.target.closest('button');if(!b||q.dataset.done)return;
    q.dataset.done=1;const a=+q.dataset.a;b.classList.add(+b.dataset.o===a?'ok':'bad');
    q.querySelectorAll('button')[a].classList.add('ok');q.querySelector('.why').hidden=false});
  app.querySelectorAll('.card').forEach(b=>b.onclick=()=>{const f=b.classList.toggle('flip');b.textContent=f?b.dataset.b:b.dataset.f;math(b)});
  document.getElementById('fin').onclick=e=>{done[id+'/'+n]=1;store();e.target.textContent='Finished'};
  math();
}

async function route(){
  const p=location.hash.slice(2).split('/');window.scrollTo(0,0);
  try{ if(p[0]==='c'&&p[2])await lesson(p[1],+p[2]); else if(p[0]==='c'&&p[1])await course(p[1]); else await home(); }
  catch(e){app.innerHTML='<p class="note">Could not load this page. Check your connection and try again.</p>'}
}
addEventListener('hashchange',route);addEventListener('load',()=>math());route();
</script>
</body>
</html>
