<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b4332">
<title>Scientific Calculator – Learning Hub</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fira+Mono:wght@400;500&family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{--green:#1b4332;--mid:#2d6a4f;--gold:#c9a84c;--canvas:#f4f2ed;--ink:#1a1a1a;--lcd:#eef2f6;--pad:#3a3a3d;--fk:#c5cad6;--fk2:#d3d8e2;--nk:#1d1d20;--ok:#707074;--shiftg:#4fc79d;--orange:#f0a232;--sl:#d7d7dd}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--green);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);overscroll-behavior:none}
.app{max-width:560px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--pad);position:relative;overflow:hidden}
.top{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--green);border-bottom:3px solid var(--gold);color:#fff;flex:0 0 auto}
.top a,.top button{color:#fff;text-decoration:none;background:rgba(255,255,255,.12);border:0;border-radius:10px;padding:7px 11px;font:600 14px Inter,sans-serif}
.top .ttl{flex:1;font:700 17px "Playfair Display",Georgia,serif;letter-spacing:.2px}
.top .ttl small{display:block;font:600 10px Inter,sans-serif;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase}
.screen{flex:0 0 auto;background:var(--lcd);padding:6px 14px 10px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.ind{display:flex;gap:10px;font:700 11px/1.2 Inter,sans-serif;color:#2b4a63;min-height:16px;letter-spacing:.5px}
.ind span{opacity:.0}.ind span.on{opacity:1}
.ind .sh{background:var(--shiftg);color:#06382a;border-radius:4px;padding:0 5px}
.expr{font:500 26px/1.35 "Fira Mono",ui-monospace,Menlo,Consolas,monospace;white-space:nowrap;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;min-height:38px;padding:4px 0;color:#16202a}
.expr::-webkit-scrollbar{display:none}
.expr .a{cursor:text}
.expr .caret{display:inline-block;width:2px;height:1.15em;background:#0b5cad;vertical-align:text-bottom;margin:0 -1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.res{text-align:right;font:500 40px/1.15 "Fira Mono",ui-monospace,Menlo,Consolas,monospace;color:#10151b;min-height:46px;word-break:break-all;cursor:pointer}
.res.sm{font-size:30px}.res.xs{font-size:22px}.res.live{color:#8c98a6}.res.err{color:#c0392b;font-size:28px}
.res sup{font-size:.55em;vertical-align:.55em;line-height:0}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.05;font-size:.7em;margin:0 .15em}
.fr span:first-child{border-bottom:2px solid currentColor;padding:0 .2em}
.tabs{display:flex;gap:6px;padding:6px 8px;background:#2c2c2f;flex:0 0 auto}
.tabs button{flex:1;background:#4a4a4f;color:#e9e9ee;border:0;border-radius:8px;padding:7px 0;font:700 12px Inter,sans-serif;letter-spacing:.8px}
.tabs button:active{background:var(--mid)}
.pad{flex:1 1 auto;min-height:0;padding:0 6px 8px;display:flex;flex-direction:column;gap:2px;background:var(--pad)}
.grid{display:grid;gap:5px 5px;flex:1 1 0;min-height:0}
.g6{grid-template-columns:repeat(6,1fr);flex:5 1 0}
.g5{grid-template-columns:repeat(5,1fr);flex:4.3 1 0}
.kc{display:flex;flex-direction:column;min-height:0;min-width:0}
.sl{height:15px;font:600 10.5px/15px Inter,sans-serif;color:var(--sl);text-align:center;white-space:nowrap;overflow:hidden;opacity:.85}
.sl sup,.sl sub{font-size:.7em;line-height:0}
.kc button{flex:1;min-height:0;border:0;border-radius:7px;font:600 15px Inter,sans-serif;color:#10131a;background:var(--fk);padding:0;box-shadow:0 2px 0 rgba(0,0,0,.35);touch-action:manipulation}
.kc button:active{transform:translateY(1px);filter:brightness(.9)}
.kc button sup,.kc button sub{font-size:.62em;line-height:0}
.kc.num button{background:var(--nk);color:#fff;font-size:24px;font-weight:600}
.kc.op button{background:var(--ok);color:#fff;font-size:22px}
.kc.shift button{background:var(--shiftg);color:#06382a}
.kc.ac button,.kc.del button{background:var(--orange);color:#3a2300}
.kc.eq button{background:#7c7c80;color:#fff;font-size:26px}
.shifted .sl{color:var(--gold);font-weight:800;opacity:1}
.shifted .kc.fn button,.shifted .kc.num button,.shifted .kc.op button{opacity:.55}
.shifted .kc.shift button{outline:3px solid #fff}
.sheet{position:absolute;left:0;right:0;bottom:0;top:38%;background:#fff;border-radius:16px 16px 0 0;box-shadow:0 -8px 30px rgba(0,0,0,.45);display:none;flex-direction:column;z-index:20}
.sheet.open{display:flex}
.sheet .sh{display:flex;align-items:center;padding:12px 14px;border-bottom:1px solid #e5e1d8;font:700 16px "Playfair Display",Georgia,serif;color:var(--green)}
.sheet .sh span{flex:1}.sheet .sh button{border:0;background:#eee;border-radius:8px;font:700 16px Inter;padding:5px 11px}
.sheet .sb{overflow:auto;padding:10px 12px 18px;flex:1}
.chips{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-bottom:12px}
.chips.c3{grid-template-columns:repeat(3,1fr)}.chips.c5{grid-template-columns:repeat(5,1fr)}
.chip{border:1.5px solid #d9d4c8;background:#faf8f3;border-radius:10px;padding:10px 4px;font:600 14px Inter;color:var(--green);text-align:center;cursor:pointer;min-height:44px}
.chip small{display:block;font:500 10px Inter;color:#777;margin-top:2px;overflow:hidden;text-overflow:ellipsis}
.chip:active{background:var(--gold)}
.grp{font:700 11px Inter;letter-spacing:1.2px;color:#8a7a3d;text-transform:uppercase;margin:6px 2px 6px}
.row{display:flex;gap:10px;align-items:center;padding:11px 8px;border-bottom:1px solid #eee7;cursor:pointer;border-bottom:1px solid #eee}
.row b{color:var(--green);min-width:54px}.row span{flex:1;font-size:13px;color:#555}.row i{font-style:normal;font:500 12px "Fira Mono",monospace;color:#333;text-align:right;max-width:46%;word-break:break-all}
.hrow{padding:10px 6px;border-bottom:1px solid #eee;cursor:pointer}.hrow div:first-child{font:500 15px "Fira Mono",monospace;color:#333;word-break:break-all}.hrow div:last-child{font:600 17px "Fira Mono",monospace;color:var(--green);text-align:right}
.search{width:100%;padding:11px 12px;border:1.5px solid #d9d4c8;border-radius:10px;font:500 15px Inter;margin-bottom:8px}
.modal{position:absolute;inset:0;background:rgba(10,30,22,.96);z-index:30;display:none;flex-direction:column;padding:16px;overflow:auto}
.modal.open{display:flex}
.modal h2{color:var(--gold);font:700 22px "Playfair Display",Georgia,serif;margin:6px 0 14px}
.mgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mtile{background:#fff;border:0;border-radius:14px;padding:16px 10px;font:700 15px Inter;color:var(--green);text-align:left;min-height:74px;border-left:6px solid var(--gold)}
.mtile small{display:block;font:500 11px Inter;color:#666;margin-top:3px}
.mclose{margin-top:14px;background:transparent;border:1.5px solid var(--gold);color:var(--gold);border-radius:12px;padding:12px;font:700 15px Inter}
.pg{position:absolute;inset:0;background:var(--canvas);z-index:25;display:none;flex-direction:column}
.pg.open{display:flex}
.pgh{display:flex;align-items:center;gap:10px;padding:10px 12px;background:var(--green);border-bottom:3px solid var(--gold);color:#fff}
.pgh button{background:rgba(255,255,255,.14);border:0;color:#fff;border-radius:10px;padding:8px 12px;font:600 14px Inter}
.pgh b{font:700 18px "Playfair Display",Georgia,serif}
.pgb{flex:1;overflow:auto;padding:14px 14px 40px}
.fld{display:block;margin:0 0 10px}.fld>span{display:block;font:600 12px Inter;color:#555;margin-bottom:4px;letter-spacing:.3px}
.fld input,.fld select,.fld textarea,.in{width:100%;padding:11px 12px;border:1.5px solid #cfc9bb;border-radius:10px;font:500 16px "Fira Mono",ui-monospace,monospace;background:#fff;color:#111}
.fld select{font-family:Inter,sans-serif;font-weight:600}
.fld textarea{min-height:68px;resize:vertical}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.btnp{background:var(--green);color:#fff;border:0;border-radius:12px;padding:13px 16px;font:700 15px Inter;width:100%;margin:6px 0 10px;border-bottom:3px solid var(--gold)}
.btns{background:#fff;color:var(--green);border:1.5px solid var(--green);border-radius:10px;padding:9px 12px;font:700 13px Inter;margin:0 6px 6px 0}
.out{background:#fff;border:1px solid #e2ddd4;border-left:5px solid var(--gold);border-radius:12px;padding:12px 14px;margin-top:6px;font:500 15px "Fira Mono",ui-monospace,monospace;color:#16202a;word-break:break-word}
.out.err{border-left-color:#c0392b;color:#c0392b;font-family:Inter}
.out .r{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-bottom:1px dashed #e8e3d8}.out .r:last-child{border:0}.out .r b{font:600 13px Inter;color:#555}
.out sup{font-size:.6em}
.mat{display:grid;gap:5px;margin:6px 0 12px}
.mat input{padding:9px 4px;text-align:center;font-size:15px;min-width:0}
.mres{display:inline-grid;gap:4px;margin-top:6px}.mres div{background:#f3efe4;border-radius:8px;padding:8px 10px;text-align:right;min-width:60px;font:500 14px "Fira Mono",monospace}
table.tb{width:100%;border-collapse:collapse;font:500 14px "Fira Mono",monospace;background:#fff;border-radius:10px;overflow:hidden}
table.tb th{background:var(--green);color:#fff;padding:8px;font:600 12px Inter}table.tb td{padding:7px 10px;border-bottom:1px solid #eee;text-align:right}
.bn{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-top:10px}
.bn button{padding:13px 0;border:0;border-radius:9px;background:#fff;border-bottom:2px solid #cfc9bb;font:700 16px Inter;color:var(--green)}
.bn button:disabled{opacity:.25}.bn button.o{background:#e8efe9}.bn button.a{background:var(--orange);color:#3a2300}.bn button.on{background:var(--green);color:#fff}
.bd{background:#fff;border-radius:12px;border:1px solid #e2ddd4;padding:10px 12px;font:500 15px "Fira Mono",monospace}.bd .r{display:flex;justify-content:space-between;padding:4px 0}.bd .r b{font:700 12px Inter;color:#777}
.help h3{font:700 16px "Playfair Display",serif;color:var(--green);margin:16px 0 6px}.help p,.help li{font-size:14px;line-height:1.5;color:#333}.help code{background:#efe9d8;border-radius:4px;padding:1px 5px;font:500 13px "Fira Mono",monospace}
.toast{position:absolute;left:50%;top:134px;transform:translateX(-50%);background:#111;color:#fff;border-radius:20px;padding:8px 16px;font:600 13px Inter;z-index:50;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:.95}
@media (max-height:700px){.screen{min-height:112px;padding-bottom:6px}.expr{font-size:23px;min-height:32px}.res{font-size:34px;min-height:40px}.kc button{font-size:14px}.kc.num button{font-size:21px}.top{padding:6px 10px}}
@media (max-height:620px){.screen{min-height:92px}.expr{font-size:19px;min-height:26px}.res{font-size:26px;min-height:32px}.top .ttl small{display:none}.tabs{padding:4px 8px}.tabs button{padding:5px 0}.sl{height:12px;font-size:9px;line-height:12px}.kc button{font-size:12px;border-radius:5px}.kc.num button{font-size:18px}}
@media (max-width:340px){.top .ttl{font-size:14px}.top a,.top button{padding:6px 8px;font-size:12px}}

.mtile.wide{grid-column:1/-1;background:var(--gold);color:#1b2a1f;border-left-color:#fff}.mtile.wide small{color:#3a3320}
details.gd{background:#fff;border:1px solid #e2ddd4;border-radius:12px;margin:0 0 8px;overflow:hidden}
details.gd summary{padding:13px 14px;font:700 15px Inter,sans-serif;color:var(--green);cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.gd summary::-webkit-details-marker{display:none}
details.gd summary::after{content:'+';font:700 20px Inter;color:var(--gold)}
details.gd[open] summary::after{content:'−'}
details.gd[open] summary{border-bottom:1px solid #eee7d6;background:#faf8f3}
.gb{padding:6px 14px 12px}
.gb ul{padding-left:20px;margin:6px 0}.gb p{margin:8px 0}
.ex{margin-top:10px;background:#faf8f3;border-radius:10px;padding:8px 10px}
.exr{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:5px 0;border-bottom:1px dashed #e8e3d8;font:500 13px "Fira Mono",monospace;color:#333}
.exr:last-child{border:0}.exr .btns{margin:0;padding:7px 14px;flex:0 0 auto}

<body>
<div class="app">
  <div class="top"><a href="../index.html" aria-label="Back to home">‹ Home</a><div class="ttl"><small>Learning Hub</small>Scientific Calculator</div><button id="btnMenu" type="button">☰ Menu</button></div>
  <section class="screen">
    <div class="ind" id="ind"></div>
    <div class="expr" id="expr"></div>
    <div class="res" id="res">0</div>
  </section>
  <nav class="tabs"><button type="button" data-k="func">FUNC</button><button type="button" data-k="var">VAR</button><button type="button" data-k="const">CONST</button><button type="button" data-k="hist">HISTORY</button></nav>
  <section class="pad" id="pad"></section>
  <div class="sheet" id="sheet"><div class="sh"><span id="stitle"></span><button id="sclose" type="button">✕</button></div><div class="sb" id="sbody"></div></div>
  <div class="modal" id="menu"></div>
  <div class="pg" id="page"></div>
  <div class="toast" id="toast"></div>
</div>
<script>
/* Scientific calculator engine - pure functions, no page code */
var Engine = (function () {
'use strict';
const PI = Math.PI;
class MathErr extends Error { constructor(m) { super(m || 'Math ERROR'); this.kind = 'math'; } }
class SynErr extends Error { constructor(m) { super(m || 'Syntax ERROR'); this.kind = 'syntax'; } }
const bad = () => { throw new MathErr(); };
const syn = () => { throw new SynErr(); };

/* ---------- numbers: plain JS numbers, or {re, im} for complex ---------- */
const isC = v => v !== null && typeof v === 'object';
const R = v => (isC(v) ? v.re : v);
const I = v => (isC(v) ? v.im : 0);
function C(r, i) {
  if (!isFinite(r) || !isFinite(i)) bad();
  const m = Math.max(Math.abs(r), Math.abs(i));
  if (Math.abs(i) <= 1e-14 * m) return r;
  if (Math.abs(r) <= 1e-14 * m) r = 0;
  return { re: r, im: i };
}
const fin = x => { if (!isFinite(x)) bad(); return x; };
const add = (a, b) => (isC(a) || isC(b) ? C(R(a) + R(b), I(a) + I(b)) : fin(a + b));
const sub = (a, b) => (isC(a) || isC(b) ? C(R(a) - R(b), I(a) - I(b)) : fin(a - b));
const mul = (a, b) => (isC(a) || isC(b) ? C(R(a) * R(b) - I(a) * I(b), R(a) * I(b) + I(a) * R(b)) : fin(a * b));
const div = (a, b) => {
  if (isC(a) || isC(b)) { const d = R(b) * R(b) + I(b) * I(b); if (d === 0) bad(); return C((R(a) * R(b) + I(a) * I(b)) / d, (I(a) * R(b) - R(a) * I(b)) / d); }
  if (b === 0) bad(); return fin(a / b);
};
const neg = a => (isC(a) ? { re: -a.re, im: -a.im } : -a);
const cabs = a => (isC(a) ? Math.hypot(a.re, a.im) : Math.abs(a));
const carg = a => (isC(a) ? Math.atan2(a.im, a.re) : (a < 0 ? PI : 0));
const cexp = a => { const e = Math.exp(R(a)); return C(e * Math.cos(I(a)), e * Math.sin(I(a))); };
const cln = a => { if (R(a) === 0 && I(a) === 0) bad(); return C(Math.log(cabs(a)), carg(a)); };
const csqrt = a => { const r = cabs(a); const x = Math.sqrt((r + R(a)) / 2); let y = Math.sqrt(Math.max(0, (r - R(a)) / 2)); if (I(a) < 0) y = -y; return C(x, y); };
const J = { re: 0, im: 1 };

/* ---------- fractions ---------- */
function frac(x, maxD) {
  maxD = maxD || 99999;
  if (!isFinite(x)) return null;
  const s = x < 0 ? -1 : 1; x = Math.abs(x);
  if (x === Math.floor(x)) return { n: s * x, d: 1 };
  let h1 = 1, h0 = 0, k1 = 0, k0 = 1, b = x;
  for (let i = 0; i < 40; i++) {
    const a = Math.floor(b), h2 = a * h1 + h0, k2 = a * k1 + k0;
    if (k2 > maxD) break;
    h0 = h1; h1 = h2; k0 = k1; k1 = k2;
    if (Math.abs(x - h1 / k1) <= 1e-13 * x) return { n: s * h1, d: k1 };
    const f = b - a; if (f < 1e-14) break; b = 1 / f;
  }
  return null;
}

/* ---------- special functions ---------- */
const LG = [0.99999999999980993, 676.5203681218851, -1259.1392167224028, 771.32342877765313, -176.61502916214059, 12.507343278686905, -0.13857109526572012, 9.9843695780195716e-6, 1.5056327351493116e-7];
function lgamma(x) {
  if (x < 0.5) return Math.log(PI / Math.abs(Math.sin(PI * x))) - lgamma(1 - x);
  x -= 1; let a = LG[0]; const t = x + 7.5;
  for (let i = 1; i < 9; i++) a += LG[i] / (x + i);
  return 0.5 * Math.log(2 * PI) + (x + 0.5) * Math.log(t) - t + Math.log(a);
}
function gamma(x) {
  if (x < 0.5) return PI / (Math.sin(PI * x) * gamma(1 - x));
  return Math.exp(lgamma(x));
}
function fact(n) {
  if (isC(n) || n < 0 || !isFinite(n)) bad();
  if (Number.isInteger(n)) { if (n > 170) bad(); let r = 1; for (let i = 2; i <= n; i++) r *= i; return r; }
  return fin(gamma(n + 1));
}
const isInt = x => !isC(x) && Number.isInteger(x);
function perm(n, r) { if (!isInt(n) || !isInt(r) || n < 0 || r < 0 || r > n) bad(); let p = 1; for (let i = n - r + 1; i <= n; i++) p *= i; return fin(p); }
function comb(n, r) { if (!isInt(n) || !isInt(r) || n < 0 || r < 0 || r > n) bad(); r = Math.min(r, n - r); let c = 1; for (let i = 1; i <= r; i++) c = Math.round(c * (n - r + i) / i); return fin(c); }
const gcd2 = (a, b) => { a = Math.abs(a); b = Math.abs(b); while (b) { [a, b] = [b, a % b]; } return a; };
function erfSeries(x) { let term = x, sum = x; for (let n = 1; n < 200; n++) { term *= 2 * x * x / (2 * n + 1); sum += term; if (Math.abs(term) < 1e-17 * Math.abs(sum)) break; } return 2 / Math.sqrt(PI) * Math.exp(-x * x) * sum; }
function erfc(x) {
  if (x < 0) return 2 - erfc(-x);
  if (x < 3) return 1 - erfSeries(x);
  let t = x; for (let k = 80; k >= 1; k--) t = x + (k / 2) / t;
  return Math.exp(-x * x) / (Math.sqrt(PI) * t);
}
const normCDF = (x, mu, sd) => 0.5 * erfc(-(x - mu) / (sd * Math.SQRT2));
function invNorm(p, mu, sd) {
  if (!(p > 0 && p < 1) || !(sd > 0)) bad();
  let lo = -40, hi = 40;
  for (let i = 0; i < 200; i++) { const m = (lo + hi) / 2; if (normCDF(m, 0, 1) < p) lo = m; else hi = m; }
  return mu + sd * (lo + hi) / 2;
}
const binomPMF = (k, n, p) => { if (k < 0 || k > n) return 0; if (p === 0) return k === 0 ? 1 : 0; if (p === 1) return k === n ? 1 : 0; return Math.exp(lgamma(n + 1) - lgamma(k + 1) - lgamma(n - k + 1) + k * Math.log(p) + (n - k) * Math.log(1 - p)); };
const poisPMF = (k, l) => (k < 0 ? 0 : Math.exp(-l + k * Math.log(l) - lgamma(k + 1)));

/* ---------- angles ---------- */
const uf = u => (u === 'deg' ? PI / 180 : u === 'gra' ? PI / 200 : 1);
const quarter = u => (u === 'deg' ? 90 : u === 'gra' ? 100 : PI / 2);
const tidy = v => parseFloat(v.toPrecision(15));
function sincos(x, u, which) {
  const q = x / quarter(u), rq = Math.round(q);
  if (rq !== 0 && Math.abs(q - rq) < 1e-11 * Math.max(1, Math.abs(q))) { const k = ((rq % 4) + 4) % 4; return which === 'sin' ? [0, 1, 0, -1][k] : [1, 0, -1, 0][k]; }
  if (x === 0) return which === 'sin' ? 0 : 1;
  const v = which === 'sin' ? Math.sin(x * uf(u)) : Math.cos(x * uf(u));
  return tidy(v);
}
const scale = (z, k) => (isC(z) ? C(z.re * k, z.im * k) : z * k);

pages.matrix = {

    const draw = () => {

      outs.textContent = ''; if (res !== null) { const u = BigInt.asUintN(32, res); [['DEC', BigInt.asIntN(32, res).toString()], ['HEX', u.toString(16).toUpperCase()], ['BIN', u.toString(2).replace(/(?=(\d{4})+$)/g, ' ').trim()], ['OCT', u.toString(8)]].forEach(([k, v]) => outs.appendChild(h('div', { class: 'r' }, h('b', null, k), h('span', null, v)))); } else outs.appendChild(h('div', { style: 'color:#888;font:500 13px Inter' }, 'Press = to see the result in DEC, HEX, BIN and OCT (32-bit)'));
      tabs.textContent = ''; [10, 16, 2, 8].forEach(bb => tabs.appendChild(h('button', { type: 'button', class: bb === base ? 'on' : '', onclick: () => { commit(); base = bb; draw(); build(); } }, BN[bb])));
    };
    const commit = () => { if (cur) { items.push(BigInt.asIntN(32, BigInt(base === 10 ? cur : (base === 16 ? '0x' : base === 2 ? '0b' : '0o') + cur))); cur = ''; } };
    const op = o => () => { commit(); items.push(o); res = null; draw(); };
    const build = () => {
      pad.textContent = '';
      '0123456789ABCDEF'.split('').forEach(d => pad.appendChild(h('button', { type: 'button', disabled: parseInt(d, 16) >= base, onclick: () => { try { const t = cur + d; if (BigInt(base === 10 ? t : (base === 16 ? '0x' : base === 2 ? '0b' : '0o') + t) > 0xFFFFFFFFn) return; cur = t; res = null; draw(); } catch (e) {} } }, d)));
      [['+', '+'], ['-', '−'], ['*', '×'], ['/', '÷'], ['and', 'AND'], ['or', 'OR'], ['xor', 'XOR'], ['xnor', 'XNOR'], ['not', 'NOT'], ['neg', 'NEG'], ['(', '('], [')', ')']].forEach(([o, t]) => pad.appendChild(h('button', { type: 'button', class: 'o', onclick: op(o) }, t)));
      pad.appendChild(h('button', { type: 'button', class: 'a', onclick: () => { if (cur) cur = cur.slice(0, -1); else items.pop(); res = null; draw(); } }, 'DEL'));
      pad.appendChild(h('button', { type: 'button', class: 'a', onclick: () => { items = []; cur = ''; res = null; draw(); } }, 'AC'));
      pad.appendChild(h('button', { type: 'button', class: 'on', style: 'grid-column:span 1', onclick: () => { try { commit(); res = E.baseEval(items); items = [res]; } catch (e) { res = null; disp.textContent = e.kind === 'syntax' ? 'Syntax ERROR' : 'Math ERROR'; items = []; cur = ''; return; } draw(); } }, '='));
    };
    b.append(tabs, disp, pad, outs); draw(); build();
  },
};

/* Guide */
function atomsFromText(str) {
  const FN = /^(sigma|prod|integral|deriv|lim|asinh|acosh|atanh|asin|acos|atan|sinh|cosh|tanh|log2|logb|sqrt|cbrt|sin|cos|tan|ln|log|exp|abs|floor|ceil|round|int|frac|sign|gcd|lcm|ranint|rpol|apol|xrec|yrec|conj|re|im|arg)\(/;
  const out = []; let i = 0;
  while (i < str.length) {
    const rest = str.slice(i); let m;
    if ((m = rest.match(FN))) { out.push({ p: m[1] + '(', d: DISP[m[1]] || m[1] + '(' }); i += m[0].length; }
    else if (rest.startsWith('Ans')) { out.push({ p: 'Ans', d: 'Ans' }); i += 3; }
    else if (rest.startsWith('Ran#')) { out.push({ p: 'Ran#', d: 'Ran#' }); i += 4; }
    else if (rest.startsWith('pi')) { out.push({ p: 'π', d: 'π' }); i += 2; }
    else if (rest.startsWith('nCr')) { out.push({ p: 'nCr', d: 'C' }); i += 3; }
    else if (rest.startsWith('nPr')) { out.push({ p: 'nPr', d: 'P' }); i += 3; }
    else if (rest.startsWith('mod')) { out.push({ p: 'mod', d: 'mod' }); i += 3; }
    else if (rest.startsWith('E') && /^E[-+]?\d/.test(rest) && out.length && /\d/.test(out[out.length - 1].p)) { out.push({ p: 'ᴇ', d: 'ᴇ' }); i++; }
    else { const c = str[i]; i++; if (c === ' ') continue; if (c === '*') out.push({ p: '×', d: '×' }); else if (c === '/') out.push({ p: '÷', d: '÷' }); else if (c === '-') out.push({ p: '−', d: '−' }); else if (c === 'e') out.push({ p: '(e)', d: 'e' }); else out.push({ p: c, d: c }); }
  }
  return out;
}
function tryExample(expr, o) {
  o = o || {}; closePage(); ac();
  if (o.unit && S.set.unit !== o.unit) { S.set.unit = o.unit; saveSet(); toast('Angle set to ' + o.unit.toUpperCase()); }
  if (o.cplx && S.set.cplx === 'off') { S.set.cplx = 'rect'; saveSet(); toast('Complex numbers turned ON'); }
  S.atoms = atomsFromText(expr); S.pos = S.atoms.length; S.fresh = false; changed(); calc();
}
const GUIDE = [
  ['1. The screen', true, `<p>The top line shows <b>DEG / RAD / GRA</b> (angle unit), <b>SHIFT</b>, <b>HYP</b>, <b>M</b> (something is stored in memory) and <b>CPLX</b> (complex numbers on).</p><p>Below it is the line you type on, with a blinking cursor. The big number at the bottom right is the answer. While you type, a grey preview of the answer shows; press <b>=</b> to confirm it.</p><p>Tap the answer to copy it.</p>`, [['2+3×4', '2+3*4']]],
  ['2. Typing and fixing mistakes', false, `<p>Press the keys in the order you would write the sum, then press <b>=</b>.</p><ul><li><b>◄ ►</b> move the cursor. You can also tap the line to put the cursor there.</li><li><b>DEL</b> deletes the item before the cursor.</li><li><b>AC</b> clears the line.</li><li>After <b>=</b>, press <b>+ − × ÷</b> to carry on from the last answer, or press a number to start fresh.</li><li>Pressing <b>DEL</b> after <b>=</b> brings the sum back so you can edit it.</li><li>You can leave out closing brackets at the end. They are added for you.</li></ul>`, [['(12+8)/4', '(12+8)/4'], ['2(3+4)', '2(3+4)']]],
  ['3. SHIFT (second functions)', false, `<p>Tap <b>SHIFT</b>. It turns green and the small <b style="color:#b8962f">gold labels</b> light up. The next key you press uses its gold label, then SHIFT switches off by itself.</p><p>Example: <b>SHIFT</b>, <b>sin</b> gives sin⁻¹. To find the angle whose sine is 0.5, press SHIFT, sin, 0.5, = (answer 30).</p>`, [['sin⁻¹(0.5) in degrees', 'asin(0.5)', { unit: 'deg' }]]],
  ['4. Angles: DEG, RAD, GRA', false, `<p>The <b>DRG</b> key cycles the angle unit: degrees → radians → gradians. The current unit is shown on the screen.</p><p>Always check it before using sin, cos or tan. sin(30) is 0.5 in DEG but −0.988 in RAD.</p><p>Degrees-minutes-seconds: press SHIFT + <b>°′″</b> to type °, and use the ′ ″ keys from the <b>FUNC</b> tab. The <b>°′″</b> key on an answer shows it as degrees, minutes, seconds.</p>`, [['sin(30)', 'sin(30)', { unit: 'deg' }], ['cos(60)', 'cos(60)', { unit: 'deg' }], ['sin(30°15′36″)', 'sin(30°15′36″)', { unit: 'deg' }]]],
  ['5. Fractions and how answers look', false, `<ul><li><b>S⇔D</b> switches the answer between decimal and fraction (when it can be a fraction).</li><li><b>a b/c</b> shows a mixed fraction like 1¾. SHIFT + a b/c shows 7/4.</li><li>SHIFT + <b>S⇔D</b> (FSE) cycles the display: Normal → Fix (fixed decimal places) → Sci (scientific) → Eng (engineering). Choose how many digits in <b>Settings</b>.</li><li>Very big or very small answers appear like 1.5×10¹².</li><li>Enter powers of ten with <b>EXP</b>: 1.5 EXP 12.</li></ul>`, [['1 ÷ 3 (press S⇔D after)', '1/3'], ['7 ÷ 4 (press a b/c after)', '7/4'], ['1.5ᴇ12', '1.5E12']]],
  ['6. Powers, roots and logs', false, `<ul><li><b>x²</b>, <b>x³</b> (SHIFT + x²), <b>x⁻¹</b> (reciprocal), <b>xʸ</b> (any power).</li><li><b>√</b> square root, SHIFT + √ for cube root, SHIFT + xʸ for the x-th root (type 3, SHIFT xʸ, 27 gives 3).</li><li><b>log</b> is base 10, <b>ln</b> is base e, SHIFT + e gives log with any base: log_b(2, 8) = 3.</li><li>SHIFT + log is 10ˣ and SHIFT + ln is eˣ.</li><li><b>x!</b> is factorial (SHIFT + x⁻¹). <b>nCr</b> and <b>nPr</b> are SHIFT + 5 and SHIFT + 6.</li><li><b>%</b> is SHIFT + ( . 200 × 15% = 30.</li></ul>`, [['2^10', '2^10'], ['3ˣ√27 (cube root of 27)', '3ˣ√27'], ['log(1000)', 'log(1000)'], ['5!', '5!'], ['10 nCr 3', '10nCr3'], ['200 × 15%', '200*15%']]],
  ['7. Brackets and order of working', false, `<p>The calculator follows the normal order: brackets, powers, ×÷, then +−. So 2+3×4 = 14.</p><p>Writing a number next to a bracket or π multiplies, and it ranks above ÷ (like a Casio): 1÷2π means 1÷(2π).</p>`, [['2π', '2pi'], ['1 ÷ 2π', '1/2pi'], ['−3²  (equals −9)', '-3^2']]],
  ['8. Memory and variables', false, `<ul><li><b>STO</b> stores the last answer in A–F, X, Y or M. A list appears: tap the letter.</li><li><b>X</b> and <b>Y</b> keys, and SHIFT + X (A) and SHIFT + Y (B), put the variables in your sum.</li><li><b>MR</b> inserts M. SHIFT + MR adds the last answer to M. SHIFT + STO subtracts it. The <b>M</b> light shows when M is not zero.</li><li>The <b>VAR</b> tab shows all variables with their values, and can clear them.</li><li><b>Ans</b> (SHIFT + (−)) is the last answer.</li></ul><p>Example: calculate 7×6, press STO and tap A. Later A + 1 gives 43.</p>`, [['7 × 6', '7*6']]],
  ['9. Calculus keys', false, `<p>These all use the letter <b>X</b>. Separate the parts with a comma (SHIFT + 9).</p><ul><li><b>Σ( f, start, end )</b> adds up f for X = start … end. Π multiplies (SHIFT + Σ).</li><li><b>∫( f, a, b )</b> area under f from a to b.</li><li><b>d/dx( f, point )</b> slope of f at the point (SHIFT + ∫dx).</li><li><b>lim( f, point )</b> the limit (SHIFT + SOLVE).</li></ul>`, [['Σ(X², 1, 10)', 'sigma(X^2,1,10)'], ['∫(X², 0, 3)', 'integral(X^2,0,3)'], ['d/dx(X³, 2)', 'deriv(X^3,2)'], ['lim sin X / X, X → 0', 'lim(sin(X)/X,0)', { unit: 'rad' }], ['5!  = Π(X,1,5)', 'prod(X,1,5)']]],
  ['10. SOLVE (find X in an equation)', false, `<p>Type an equation using X. For the equals sign press SHIFT + <b>=</b> (it shows [ = ]). Then press <b>SOLVE</b>. If you leave out the equals sign it solves f(X) = 0.</p><p>It lists every answer it finds between −1000 and 1000, and puts the first one in X.</p>`, [['X² − 4 = 0', 'X^2-4=0'], ['2X + 3 = 11', '2X+3=11'], ['sin X = 0.5 (DEG)', 'sin(X)=0.5', { unit: 'deg' }]]],
  ['11. Complex numbers', false, `<p>Turn them on with SHIFT + <b>7</b> (CPLX). Press again to show answers as r∠θ, and again to turn off. While they are off, √(−4) gives Math ERROR.</p><p>Use the <b>i</b> key. SHIFT + i types ∠ so 5∠90 means 5 at an angle of 90°. The <b>FUNC</b> tab has Re, Im, Conj and arg.</p>`, [['√(−4)', 'sqrt(-4)', { cplx: true }], ['(1+i)(1−i)', '(1+i)(1-i)', { cplx: true }], ['abs(3+4i)', 'abs(3+4i)', { cplx: true }]]],
  ['12. The tabs: FUNC, VAR, CONST, HISTORY', false, `<ul><li><b>FUNC</b> (or SHIFT + 0): about 50 more functions: hyperbolic, rounding, gcd/lcm, random, polar ⇄ rectangular, complex and calculus.</li><li><b>VAR</b>: your stored variables.</li><li><b>CONST</b> (or SHIFT + 1): 30 physics and science constants like c, h, g, G. Search by name, tap one to insert it.</li><li><b>HISTORY</b>: your past calculations. Tap one to bring it back.</li><li>SHIFT + <b>hyp</b> (the π key) makes the next sin, cos or tan hyperbolic.</li></ul>`, []],
  ['13. Statistics (MENU → Statistics)', false, `<p>Type your numbers separated by spaces or commas, then press Calculate.</p><ul><li><b>One variable</b>: count, sum, mean, standard deviations, variance, quartiles, median, mode, minimum, maximum. Add frequencies if some numbers repeat.</li><li><b>Regression</b>: type X values and Y values, choose linear, quadratic, log, exponential, power or inverse. You get a, b (and c), the correlation r, and you can predict ŷ for any x or x̂ for any y.</li></ul>`, []],
  ['14. Distributions (MENU → Distribution)', false, `<ul><li><b>Normal</b>: probability between two limits (leave a box empty for no limit), inverse normal (the x for a given area), and density.</li><li><b>Binomial</b>: P(X = k), P(X ≤ k), P(X ≥ k), mean and variance.</li><li><b>Poisson</b>: P(X = k), P(X ≤ k), P(X ≥ k).</li></ul>`, []],
  ['15. Equations (MENU → Equations)', false, `<ul><li><b>Simultaneous</b> with 2, 3 or 4 unknowns. Write each row's numbers in the boxes: the coefficients, then the number on the right of the equals sign. Example: 2x + y = 5 and x − y = 1 gives x = 2, y = 1.</li><li><b>Polynomial</b> of degree 2 to 6. Fill the coefficients from the highest power to the constant. Complex roots are shown too.</li></ul><p>You can type sums in the boxes, like 1/2 or √2.</p>`, []],
  ['16. Matrix (MENU → Matrix)', false, `<p>Set the size (up to 4×4) and fill matrices A and B. Choose an operation: A + B, A − B, A × B, B × A, k × A, transpose, inverse, determinant, power, rank, trace or eigenvalues. Press Calculate. A result can be copied into A or B with the Result → A / B buttons to keep going.</p>`, []],

/* ---------- start ---------- */
function init() {
  buildPad(); buildMenu();
  $('#expr').addEventListener('click', ev => { const a = ev.target.closest('.a'); if (a) { const i = +a.getAttribute('data-i'), r = a.getBoundingClientRect(); S.pos = ev.clientX < r.left + r.width / 2 ? i : i + 1; } else S.pos = S.atoms.length; S.fresh = false; refresh(); });
  $('#res').addEventListener('click', () => { const t = $('#res').textContent; if (t && navigator.clipboard) navigator.clipboard.writeText(t.replace('−', '-')).then(() => toast('Copied: ' + t), () => {}); });
  document.querySelectorAll('.tabs button').forEach(bt => bt.addEventListener('click', () => { const k = bt.getAttribute('data-k'); const open = $('#sheet').classList.contains('open') && $('#sheet').getAttribute('data-k') === k; if (open) closeSheet(); else { openSheet(k); $('#sheet').setAttribute('data-k', k); } }));
  $('#sclose').addEventListener('click', closeSheet);
  $('#btnMenu').addEventListener('click', openMenu);
  document.addEventListener('keydown', ev => {
    const t = ev.target; if (t && /^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)) return; if ($('#page').classList.contains('open') || $('#menu').classList.contains('open')) return;
    const k = ev.key; if (ev.ctrlKey || ev.metaKey || ev.altKey) return; let used = true;
    if (/^[0-9]$/.test(k)) put(k); else if (k === '.') put('.'); else if (k === '+') put('+'); else if (k === '-') put('−'); else if (k === '*') put('×'); else if (k === '/') put('÷'); else if (k === '^') put('^'); else if (k === '(' || k === ')') put(k); else if (k === '!') put('!'); else if (k === '%') put('%'); else if (k === ',') put(',');
    else if (k === 'Enter' || k === '=') calc(); else if (k === 'Backspace') del(); else if (k === 'Escape') ac(); else if (k === 'ArrowLeft') move(-1); else if (k === 'ArrowRight') move(1); else used = false;
    if (used) ev.preventDefault();
  });
  refresh();
  window.__calc = { S, press, put, calc, ac, E };
}
init();
})();
