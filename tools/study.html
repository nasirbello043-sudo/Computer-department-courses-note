<style>
:root{--green:#1b4332;--mid:#2d6a4f;--gold:#c9a84c;--canvas:#f4f2ed;--ink:#1a1a1a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--green);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink)}
.app{max-width:760px;margin:0 auto;height:100vh;height:100dvh;display:flex;flex-direction:column;background:var(--canvas)}
.top{display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--green);border-bottom:3px solid var(--gold);color:#fff;flex:0 0 auto}
.top a,.top button{color:#fff;text-decoration:none;background:rgba(255,255,255,.13);border:0;border-radius:10px;padding:8px 12px;font:600 14px Inter,sans-serif;cursor:pointer}
.top .ttl{flex:1;font:700 18px "Playfair Display",Georgia,serif}
.top .ttl small{display:block;font:600 10px Inter,sans-serif;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase}
.focus{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:1px solid #e5e1d8;flex:0 0 auto;font:600 12px Inter}
.focus select{flex:1;min-width:0;padding:8px 10px;border:1.5px solid #d6d0c2;border-radius:10px;font:500 13px Inter;background:#faf8f3;color:#222}
.focus .left{white-space:nowrap;color:#6b6b6b;font-weight:600}
.focus .left b{color:var(--green)}
#chat{flex:1;min-height:0;overflow-y:auto;padding:14px 12px 8px;scroll-behavior:smooth}
.welcome{background:#fff;border:1px solid #e2ddd4;border-left:5px solid var(--gold);border-radius:14px;padding:14px 16px;margin-bottom:14px}
.welcome h2{margin:0 0 6px;font:700 20px "Playfair Display",Georgia,serif;color:var(--green)}
.welcome p{margin:6px 0;font-size:14.5px;line-height:1.55;color:#333}
.welcome .stats{font:600 12px Inter;color:#8a7a3d;letter-spacing:.5px;margin-top:8px}
.msg{display:flex;gap:8px;margin:0 0 14px;align-items:flex-start}
.msg.user{justify-content:flex-end}
.av{flex:0 0 32px;height:32px;border-radius:50%;background:var(--green);color:var(--gold);display:flex;align-items:center;justify-content:center;font:700 11px Inter;border:2px solid var(--gold)}
.bub{max-width:calc(100% - 44px);padding:11px 14px;border-radius:16px;font-size:15px;line-height:1.55;word-wrap:break-word;overflow-wrap:anywhere}
.user .bub{background:var(--green);color:#fff;border-bottom-right-radius:4px;max-width:86%;white-space:pre-wrap}
.ai .bub{background:#fff;border:1px solid #e2ddd4;border-top-left-radius:4px;min-width:0}
.ai .bub>*:first-child{margin-top:0}.ai .bub>*:last-child{margin-bottom:0}
.bub p{margin:8px 0}.bub ul,.bub ol{margin:8px 0;padding-left:22px}.bub li{margin:3px 0}
.bub h3,.bub h4,.bub h2,.bub h5{font:700 15px "Playfair Display",Georgia,serif;color:var(--green);margin:12px 0 4px}
.bub code{background:#f1ede2;border-radius:5px;padding:1px 5px;font:500 13.5px "Fira Mono",ui-monospace,monospace}
.bub pre{background:#1f2a24;color:#e8efe9;border-radius:10px;padding:10px 12px;overflow-x:auto;font:500 13px "Fira Mono",monospace}
.bub pre code{background:none;padding:0;color:inherit}
.bub blockquote{margin:8px 0;padding:4px 12px;border-left:4px solid var(--gold);background:#faf6e8;color:#444}
.bub table{border-collapse:collapse;display:block;overflow-x:auto;margin:8px 0;font-size:14px}.bub th,.bub td{border:1px solid #ddd6c6;padding:5px 9px}.bub th{background:#f3efe4}
.bub a{color:var(--mid)}
.math.d{display:block;overflow-x:auto;padding:4px 0;text-align:center}
.cards{display:flex;flex-direction:column;gap:7px;margin-top:10px}
.card{display:flex;align-items:center;gap:10px;background:#faf8f3;border:1.5px solid #e0d9c6;border-left:5px solid var(--gold);border-radius:12px;padding:9px 12px;text-decoration:none;color:var(--green)}
.card:active{background:#f1ead2}
.card .t{flex:1;min-width:0}.card b{display:block;font:700 14px Inter;line-height:1.3}.card small{display:block;font:500 12px Inter;color:#6f6a58;margin-top:2px}
.card i{font-style:normal;font:700 18px Inter;color:var(--gold)}
.typing{display:inline-flex;gap:4px;padding:4px 2px}.typing span{width:7px;height:7px;border-radius:50%;background:#b7ae92;animation:bn 1.2s infinite}.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes bn{0%,60%,100%{transform:translateY(0);opacity:.5}30%{transform:translateY(-5px);opacity:1}}
.err{background:#fdecea!important;border-color:#f3b8b2!important;color:#8a1f15}
.err button{margin-top:8px;background:var(--green);color:#fff;border:0;border-radius:9px;padding:7px 14px;font:700 13px Inter}
.bar{flex:0 0 auto;background:#fff;border-top:1px solid #e2ddd4;padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
.chips{display:flex;gap:7px;overflow-x:auto;padding:0 0 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1.5px solid #d6cfba;background:#faf8f3;color:var(--green);border-radius:20px;padding:7px 13px;font:600 13px Inter;cursor:pointer;white-space:nowrap}
.chip:active{background:var(--gold)}
.inp{display:flex;gap:8px;align-items:flex-end}
.inp textarea{flex:1;min-width:0;resize:none;max-height:130px;padding:11px 13px;border:1.5px solid #cfc9bb;border-radius:14px;font:500 16px Inter,sans-serif;line-height:1.35;background:#fff;color:#111;outline:none}
.inp textarea:focus{border-color:var(--mid)}
.inp button{flex:0 0 46px;height:46px;border:0;border-radius:50%;background:var(--green);color:#fff;font:700 20px Inter;border-bottom:3px solid var(--gold);cursor:pointer}
.inp button.stop{background:#b3402f;border-bottom-color:#7a2519}
.inp button:disabled{opacity:.4}
.note{margin-top:6px;text-align:center;font:500 11px Inter;color:#8a8574}

.math:not([data-done]){font:italic 500 .95em "Fira Mono",ui-monospace,monospace;color:#2d4a3a}

.qhead{display:flex;justify-content:space-between;gap:10px;margin-bottom:8px;font:600 13px Inter;color:var(--green)}.qhead span{color:#8a7a3d;font-weight:600}
.qq{font-weight:600;margin:6px 0 10px}.qq p,.opt p{margin:0}
.opts{display:flex;flex-direction:column;gap:7px}
.opt{display:flex;gap:10px;align-items:flex-start;text-align:left;background:#faf8f3;border:1.5px solid #d9d2bd;border-radius:12px;padding:10px 12px;font:500 14.5px Inter;color:#1a1a1a;cursor:pointer}
.opt .lt{flex:0 0 24px;height:24px;border-radius:50%;background:var(--green);color:#fff;font:700 12px Inter;display:flex;align-items:center;justify-content:center}
.opt:active:not(:disabled){background:#f1ead2}.opt.ok{background:#e3f4e8;border-color:#2f9e5b}.opt.no{background:#fdecea;border-color:#d4574a}.opt:disabled{cursor:default}
.qfb{margin-top:10px;font-size:14px}.qfb .g{color:#2a8a4f}.qfb .r{color:#b3402f}
.nextq{margin-top:10px;background:var(--green);color:#fff;border:0;border-radius:10px;padding:9px 16px;font:700 13.5px Inter;border-bottom:3px solid var(--gold);cursor:pointer}
.qscore{font-size:15px;margin:6px 0 8px;line-height:1.5}
.pq{padding:9px 0;border-top:1px dashed #e2dccb}.pq:first-of-type{border-top:0}.pqq p{margin:0;display:inline}
.lv{font:700 10.5px Inter;font-style:normal;text-transform:uppercase;letter-spacing:.6px;color:#8a7a3d;border:1px solid #d9cfa6;border-radius:6px;padding:1px 6px}
details.pqa{margin-top:6px}details.pqa summary{cursor:pointer;color:var(--mid);font:600 13px Inter}.pqb{margin-top:6px;padding:8px 10px;background:#f3f0e4;border-radius:8px;font-size:14px}.pqb p{margin:4px 0}

.aino{font:600 12px/1.4 Inter,sans-serif;color:#8a5a00;background:#fff7e0;border:1px solid #f0dfa8;border-radius:8px;padding:6px 9px;margin:0 0 10px}

</style></head>
<body>
<div class="app">
  <div class="top"><a href="../index.html" aria-label="Back to home">‹ Home</a><div class="ttl"><small>Learning Hub · AI Tutor</small>Nova</div><button id="newChat" type="button">New chat</button></div>
  <div class="focus"><span>Study from</span><select id="focus" aria-label="Choose a course"><option value="">Any course or topic</option></select><span class="left" id="left"></span></div>

    <div class="chips">

      <button class="chip" type="button" data-a="send" data-t="Quiz me with 3 questions on a topic. Ask me which topic first.">Quiz me</button>

    <div class="note">AI can make mistakes. Check important facts with your lecturer or textbook.</div>
  </div>
</div>
<script src="study-config.js"></script>

/* ---------- site data ---------- */

function stem(w) { if (SYN[w]) return SYN[w]; if (w.length > 4 && /ies$/.test(w)) return w.slice(0, -3) + 'y'; if (w.length > 6 && /ing$/.test(w)) return w.slice(0, -3); if (w.length > 3 && /s$/.test(w) && !/(ss|us|is)$/.test(w)) return w.slice(0, -1); return w; }

    var again = el('button', 'nextq', 'Another quiz'); again.type = 'button'; again.onclick = function () { send(q && /quiz|test/i.test(q) ? q : 'Quiz me'); }; b.appendChild(again);

function practiceFor(q, focus) {

var RECOMMEND_RE = /(recommend|suggest|which course|what course|which (class|subject)|what should i (study|learn|take)|should i (take|study|learn|do)|i want to (learn|study|become|know about)|i('| a)?m interested|i love|i like|i('| wa)?nt a course|where (do|should) i start|courses? (for|about|on|in)|for beginners?|career in|become an?|best course)/;
function localRespond(text, focus, ctxText) {
  var lq = text.trim().toLowerCase(), q = String(ctxText || text).trim();

  var f = faqFor(lq, topScore); if (f) return Promise.resolve(f);

function runLocal(text, bub, focus, q) {

    if (res.build) { bub.className = 'bub'; bub.innerHTML = ''; res.build(bub); } else showAnswer(bub, res.md, true, null);
    chat.push({ role: 'assistant', content: res.store || res.md }); chat = chat.slice(-30); store.set('study_chat', chat);
  }).catch(function () { errorBubble(bub, 'Something went wrong. Please try again.'); }).then(function () { setBusy(false); });
}

/* ---------- chat ---------- */
var chat = [];           // {role, content}
var busy = false, ctrl = null, lastQ = '';
function quota() { var d = new Date(), key = d.getFullYear() + '-' + (d.getMonth() + 1) + '-' + d.getDate(); var q = store.get('study_quota', {}); if (q.date !== key) q = { date: key, used: 0 }; return q; }
function left() { return isAI() ? Math.max(0, DAILY_LIMIT - quota().used) : 999; }
function updateLeft() { $('#left').innerHTML = isAI() ? 'Left today: <b>' + left() + '</b>/' + DAILY_LIMIT : ''; var out = left() === 0; $('#q').disabled = out; $('#send').disabled = out && !busy; $('#q').placeholder = out ? 'Daily limit reached. Come back tomorrow.' : 'Ask a question…'; }
function scrollDown(force) { var c = $('#chat'); if (force || c.scrollHeight - c.scrollTop - c.clientHeight < 140) c.scrollTop = c.scrollHeight; }
function addUser(text) { var m = el('div', 'msg user'); var b = el('div', 'bub'); b.textContent = text; m.appendChild(b); $('#chat').appendChild(m); scrollDown(true); }
function aiShell() { var m = el('div', 'msg ai'); m.appendChild(el('div', 'av', 'NV')); var b = el('div', 'bub', '<div class="typing"><span></span><span></span><span></span></div>'); m.appendChild(b); $('#chat').appendChild(m); scrollDown(true); return b; }

  var x = extract(raw);
  b.className = 'bub'; b.innerHTML = md(x.text);
  if (final) {
    var cards = x.cards;

    if (cards.length) { var w = el('div', 'cards'); cards.forEach(function (c) { var a = el('a', 'card'); a.href = c.href; a.innerHTML = '<div class="t"><b>' + esc(c.title) + '</b><small>' + esc(c.sub) + '</small></div><i>›</i>'; w.appendChild(a); }); b.appendChild(w); }

}
function errorBubble(b, msg) { b.parentNode.className = 'msg ai'; b.className = 'bub err'; b.innerHTML = esc(msg) + '<br><button type="button" id="retry">Try again</button>'; var r = b.querySelector('#retry'); if (r) r.onclick = function () { b.parentNode.remove(); send(lastQ, true); }; scrollDown(true); }
function setBusy(on) { busy = on; var s = $('#send'); s.className = on ? 'stop' : ''; s.textContent = on ? '■' : '➤'; s.setAttribute('aria-label', on ? 'Stop' : 'Send'); s.disabled = false; if (!on) updateLeft(); }

    if (!r.ok) return r.json().catch(function () { return {}; }).then(function (j) { var e = new Error(j.error || 'The AI could not answer. Please try again.'); e.tried = ['worker: ' + r.status]; throw e; });
    return r;
  });
}
function askDirect(hist, ctx, signal) {

  var i = 0, tried = [], busy429 = false;
  function fail(msg) { var e = new Error(msg); e.tried = tried; throw e; }
  function next() {

    var model = DIRECT_MODELS[i++];
    return fetch(DIRECT_URL, { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + DIRECT_KEY }, body: JSON.stringify({ model: model, messages: messages, stream: true, max_tokens: 1200, temperature: 0.4 }), signal: signal }).then(function (r) {

function getStream(hist, ctx, signal) {

  return askDirect(hist, ctx, signal).catch(function (e) {
    if (e && e.name === 'TypeError') {

      var m = new Error('The browser could not reach the AI service (it may be offline, or the service does not allow requests from websites).'); m.tried = ['browser: blocked or offline']; throw m;
    }
    throw e;
  });
}
/* when the AI cannot answer, Nova answers from the lessons instead and says so */
function aiFallback(e, text, bub, focus, q) {

    var n = el('div', 'aino'); n.textContent = 'The AI is not available right now, so this answer comes from the site\'s lessons.' + detail;
    bub.insertBefore(n, bub.firstChild);
  });
}
function send(text, isRetry) {

function autoGrow() { var q = $('#q'); q.style.height = 'auto'; q.style.height = Math.min(130, q.scrollHeight) + 'px'; }
